<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Контакты | UliBakery</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #fff6f8;
            color: #5d4037;
        }
        /* Топ-бар с языками (как на главной) */
        .top-bar {
            background: #fffafa;
            padding: 10px 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid #fce4ec;
            position: relative;
            z-index: 100;
        }
        .lang button {
            background: #fff;
            border: 1px solid #ffb2c1;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
            color: #333;
        }
        .lang button:hover {
            background: #fbc2eb;
            color: white;
        }
        /* контейнер */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 35px 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(255, 182, 193, 0.25);
            text-align: center;
        }
        /* кнопка назад */
        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 22px;
            background: #ff6f91;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #ff8fab;
        }
        /* заголовок */
        h1 {
            color: #ff6f91;
            font-size: 32px;
            margin-bottom: 25px;
        }
        /* карта */
        .map-wrapper {
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* контакты */
        .contact-info {
            margin-top: 25px;
            line-height: 1.7;
        }
        .contact-info h3 {
            margin: 10px 0;
            color: #ff6f91;
        }
        .contact-info p {
            font-size: 18px;
        }
        .extra-info {
            margin: 20px 0;
            font-size: 16px;
            color: #5d4037;
        }
        /* кнопка навигации */
        .map-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: #ff6f91;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(255, 111, 145, 0.4);
        }
        .map-btn:hover {
            background: #ff8fab;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 111, 145, 0.5);
        }
        /* мобильная адаптация */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 25px 15px;
            }
            h1 {
                font-size: 26px;
            }
            .map-wrapper {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang">
            <button onclick="setLang('fi')">FI</button>
            <button onclick="setLang('ru')">RU</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-btn" id="back_btn">← На главную</a>
        <h1 id="title">Контакты UliBakery</h1>

        <!-- Google карта -->
        <div class="map-wrapper">
            <iframe
                src="https://maps.google.com/maps?q=Venuksentie%204%2001480%20Vantaa%20Finland&t=&z=16&ie=UTF8&iwloc=&output=embed"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </div>

        <!-- контактная информация -->
        <div class="contact-info">
            <h3 id="h3_name">UliBakery</h3>
            <p id="address">
                📍 Venuksentie 4, 01480 Vantaa, Finland<br>
                ✉ Ulibakery.fi@gmail.com
            </p>

            <div class="extra-info" id="extra_text">
                Заказы и вопросы — пишите на почту или в Instagram/Facebook (ссылки на главной странице)
            </div>

            <a class="map-btn" id="map_btn"
               href="https://www.google.com/maps/dir/?api=1&destination=Venuksentie+4+01480+Vantaa+Finland"
               target="_blank">
                Открыть навигацию в Google Maps
            </a>
        </div>
    </div>

    <script>
        const translations = {
            ru: {
                page_title: "Контакты | UliBakery",
                title: "Контакты UliBakery",
                back_btn: "← На главную",
                h3_name: "UliBakery",
                address: "📍 Venuksentie 4, 01480 Vantaa, Finland<br>✉ Ulibakery.fi@gmail.com",
                extra_text: "Заказы и вопросы — пишите на почту или в Instagram/Facebook (ссылки на главной странице)",
                map_btn: "Открыть навигацию в Google Maps"
            },
            fi: {
                page_title: "Yhteystiedot | UliBakery",
                title: "UliBakery yhteystiedot",
                back_btn: "← Takaisin etusivulle",
                h3_name: "UliBakery",
                address: "📍 Venuksentie 4, 01480 Vantaa, Suomi<br>✉ Ulibakery.fi@gmail.com",
                extra_text: "Tilaukset ja kysymykset — kirjoita sähköpostiin tai Instagram/Facebookiin (linkit etusivulla)",
                map_btn: "Avaa navigointi Google Mapsissa"
            },
            en: {
                page_title: "Contacts | UliBakery",
                title: "UliBakery Contacts",
                back_btn: "← Back to Home",
                h3_name: "UliBakery",
                address: "📍 Venuksentie 4, 01480 Vantaa, Finland<br>✉ Ulibakery.fi@gmail.com",
                extra_text: "Orders and questions — write to email or Instagram/Facebook (links on the main page)",
                map_btn: "Open navigation in Google Maps"
            }
        };

        function setLang(lang) {
            localStorage.setItem('uliLang', lang);
            const t = translations[lang];

            document.getElementById('page_title').innerText = t.page_title;
            document.getElementById('title').innerText = t.title;
            document.getElementById('back_btn').innerText = t.back_btn;
            document.getElementById('h3_name').innerText = t.h3_name;
            document.getElementById('address').innerHTML = t.address;
            document.getElementById('extra_text').innerText = t.extra_text;
            document.getElementById('map_btn').innerText = t.map_btn;

            // Меняем lang атрибут html для доступности
            document.documentElement.lang = lang;
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('uliLang') || 'ru';
            setLang(savedLang);
        };
    </script>
</body>
</html>
