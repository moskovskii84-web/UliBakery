<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Контакты | UliBakery</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#fff6f8;
color:#5d4037;
}

/* контейнер */

.container{
max-width:900px;
margin:40px auto;
padding:35px 20px;
background:white;
border-radius:25px;
box-shadow:0 10px 35px rgba(255,182,193,0.25);
text-align:center;
}

/* кнопка назад */

.back-btn{
display:inline-block;
margin-bottom:25px;
padding:10px 22px;
background:#ff6f91;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:0.3s;
}

.back-btn:hover{
background:#ff8fab;
}

/* заголовок */

h1{
color:#ff6f91;
font-size:32px;
margin-bottom:25px;
}

/* карта */

.map-wrapper{
width:100%;
height:400px;
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

.map-wrapper iframe{
width:100%;
height:100%;
border:0;
}

/* контакты */

.contact-info{
margin-top:25px;
line-height:1.7;
}

.contact-info h3{
margin:10px 0;
color:#ff6f91;
}

/* кнопка навигации */

.map-btn{
display:inline-block;
margin-top:20px;
padding:12px 28px;
background:#ff6f91;
color:white;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:all 0.3s ease;
box-shadow:0 6px 15px rgba(255,111,145,0.4);
}

.map-btn:hover{
background:#ff8fab;
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(255,111,145,0.5);
}

/* мобильная адаптация */

@media(max-width:600px){

.container{
margin:20px;
padding:25px 15px;
}

h1{
font-size:26px;
}

.map-wrapper{
height:320px;
}

}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back-btn">← На главную</a>

<h1>Контакты UliBakery</h1>

<!-- Google карта -->

<div class="map-wrapper">

<iframe
src="https://maps.google.com/maps?q=Venuksentie%204%2001480%20Vantaa%20Finland&t=&z=16&ie=UTF8&iwloc=&output=embed"
loading="lazy"
allowfullscreen>
</iframe>

</div>

<!-- контактная информация -->

<div class="contact-info">

<h3>UliBakery</h3>

<p>
📍 Venuksentie 4, 01480 Vantaa<br>
📞 +358 XX XXX XXXX<br>
✉ info@ulibakery.fi
</p>

<a
class="map-btn"
href="https://www.google.com/maps/dir/?api=1&destination=Venuksentie+4+01480+Vantaa+Finland"
target="_blank">
Открыть навигацию в Google Maps
</a>

</div>

</div>

</body>
</html>
