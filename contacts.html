<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | UliBakery</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #fff6f8; color: #5d4037; }
        .container { max-width: 950px; margin: 40px auto; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .back-btn { display: inline-block; background: #5d4037; color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .map-frame { width: 100%; height: 450px; border-radius: 20px; border: 2px solid #fce4ec; overflow: hidden; margin-top: 20px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; text-align: left; padding: 0 20px; }
        h3 { color: #ff6f91; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← НА ГЛАВНУЮ</a>
        <h1 style="font-family: 'Georgia', serif; color: #ff6f91;">Как нас найти</h1>
        
        <div class="info-grid">
            <div>
                <h3>Адрес</h3>
                <p>Vantaa, Kivistö<br>Финляндия</p>
            </div>
            <div>
                <h3>Доставка</h3>
                <p>Хельсинки, Эспоо, Вантаа.<br>Самовывоз по договоренности.</p>
            </div>
        </div>

        <div class="map-frame">
            <iframe src="https://www.google.com" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</body>
</html>
