<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UliBakery | Vantaa</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#fff6f8; color:#333; }
        
        /* ШАПКА */
        header { background: #fffafa; padding: 40px 0; color: #5d4037; border-bottom: 2px solid #fbc2eb; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; gap: 40px; flex-wrap: wrap; }
        .header-left img { width: 100%; max-width: 500px; height: 320px; object-fit: cover; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .header-right { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-img { width: 220px; height: 220px; object-fit: cover; border-radius: 50%; border: 4px solid #fbc2eb; margin-bottom: 15px; }
        .header-right h2 { margin: 0; font-family: 'Georgia', serif; font-size: 52px; color: #ff6f91; font-weight: bold; }

        /* НАВИГАЦИЯ */
        nav { width: 100%; text-align: center; margin-top: 40px; border-top: 1px solid #fce4ec; padding-top: 25px; }
        .nav-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 25px; }
        .nav-btn { text-decoration: none; display: flex; flex-direction: column; align-items: center; min-width: 130px; cursor: pointer; }
        .main-text { color: #5d4037; font-weight: bold; font-size: 20px; text-transform: uppercase; }
        .sub-text { color: #ff6f91; font-size: 12px; font-weight: normal; margin-top: 2px; }

        /* ВЫПАДАЮЩЕЕ МЕНЮ */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 220px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); z-index: 10; border-radius: 10px; margin-top: 5px; text-align: left; overflow: hidden; }
        .dropdown-content a { color: #5d4037; padding: 12px 16px; text-decoration: none; display: block; border-bottom: 1px solid #fff0f3; font-size: 16px; }
        .dropdown-content a:hover { background-color: #fff0f3; }
        .dropdown:hover .dropdown-content { display: block; }

        /* КНОПКИ ЯЗЫКОВ */
        .lang button { background:#fff; border:1px solid #ffb2c1; padding: 10px 18px; border-radius: 10px; cursor:pointer; font-weight:bold; margin: 0 8px; color: #333; }
        .lang button:hover { background: #fbc2eb; color: white; }

        /* ГАЛЕРЕЯ */
        .section { padding:60px 20px; text-align:center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; }
        .work-card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #fce4ec; transition: 0.3s; }
        .work-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255,111,145,0.15); }
        .img-container { width: 100%; height: 350px; overflow: hidden; cursor: zoom-in; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .work-info { padding: 15px; text-align: center; }
        .work-title { margin: 0; color: #ff6f91; font-size: 18px; font-family: 'Georgia', serif; }

        /* МОДАЛЬНОЕ ОКНО */
        #fullView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; cursor: pointer; }
        #fullView img { max-width: 95%; max-height: 90%; border-radius: 10px; }

        .hero { text-align:center; padding:60px 20px; background:#ffe3ec; }
        .btn { background:#ff3f6c; color:white; padding:12px 25px; border-radius:8px; text-decoration:none; margin:10px; display:inline-block; }
        footer { background:#fbc2eb; color:#5d4037; text-align:center; padding:20px; margin-top:40px; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="header-left"><img src="facade.jpg" alt="UliBakery"></div>
        <div class="header-right">
            <img src="logo.jpg" alt="Logo" class="logo-img">
            <h2>UliBakery</h2>
        </div>
    </div>
    <nav>
        <div class="nav-container">
            <div class="dropdown">
                <div class="nav-btn">
                    <span id="btn_cakes" class="main-text">ТОРТЫ</span>
                    <span id="btn_welcome" class="sub-text">добро пожаловать</span>
                </div>
                <div class="dropdown-content">
                    <a href="#party" id="sub_party">Детские торты</a>
                    <a href="#wedding" id="sub_wedding">Свадебные торты</a>
                    <a href="#weekend" id="sub_weekend">Сладости на выходные</a>
                </div>
            </div>
            <a href="#wedding" class="nav-btn">
                <span id="btn_gallery" class="main-text">ГАЛЕРЕЯ</span>
                <span id="sub_gallery" class="sub-text">наши работы</span>
            </a>
            <a href="#order" class="nav-btn">
                <span id="btn_order" class="main-text">ЗАКАЗАТЬ</span>
                <span id="sub_order" class="sub-text">условия</span>
            </a>
            <a href="#contact" class="nav-btn">
                <span id="btn_contact" class="main-text">КОНТАКТЫ</span>
                <span id="sub_contact" class="sub-text">где мы</span>
            </a>
        </div>
        <div class="lang">
            <button onclick="setLang('fi')">FI</button>
            <button onclick="setLang('ru')">RU</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </nav>
</header>

<!-- СВАДЕБНЫЕ ТОРТЫ -->
<section id="wedding" class="section">
    <h2 id="title_wedding" style="color: #ff6f91; font-family: 'Georgia', serif; font-size: 36px;">СВАДЕБНЫЕ ТОРТЫ</h2>
    <div class="gallery-grid" id="weddingGrid"></div>
</section>

<!-- ДЕТСКИЕ ТОРТЫ -->
<section id="party" class="section" style="background: #fffafa;">
    <h2 id="title_party" style="color: #ff6f91; font-family: 'Georgia', serif; font-size: 36px;">ДЕТСКИЕ ТОРТЫ</h2>
    <div class="gallery-grid" id="kidsGrid"></div>
</section>

<div id="fullView" onclick="this.style.display='none'"><img id="fullImg" src=""></div>

<footer><p>© 2026 UliBakery</p></footer>

<script>
const texts = {
    ru: {
        btn_cakes: "ТОРТЫ", btn_welcome: "добро пожаловать",
        btn_gallery: "ГАЛЕРЕЯ", sub_gallery: "наши работы",
        btn_order: "ЗАКАЗАТЬ", sub_order: "условия",
        btn_contact: "КОНТАКТЫ", sub_contact: "где мы",
        sub_party: "Детские торты", sub_wedding: "Свадебные торты", sub_weekend: "Сладости на выходные",
        title_wedding: "СВАДЕБНЫЕ ТОРТЫ", title_party: "ДЕТСКИЕ ТОРТЫ"
    },
    fi: {
        btn_cakes: "KAKUT", btn_welcome: "tervetuloa",
        btn_gallery: "GALLERIA", sub_gallery: "työnäytteet",
        btn_order: "TILAA", sub_order: "tilausohjeet",
        btn_contact: "YHTEYSTIEDOT", sub_contact: "löydät meidät",
        sub_party: "Lasten kakut", sub_wedding: "Hääkakut", sub_weekend: "Viikonloppuherkut",
        title_wedding: "HÄÄKAKUT", title_party: "LASTEN KAKUT"
    },
    en: {
        btn_cakes: "CAKES", btn_welcome: "welcome",
        btn_gallery: "GALLERY", sub_gallery: "our works",
        btn_order: "ORDER", sub_order: "how to order",
        btn_contact: "CONTACT", sub_contact: "find us",
        sub_party: "Kids Cakes", sub_wedding: "Wedding Cakes", sub_weekend: "Weekend Sweets",
        title_wedding: "WEDDING CAKES", title_party: "KIDS CAKES"
    }
};

function createCards(containerId, prefix, count, titleBase) {
    const grid = document.getElementById(containerId);
    if (!grid) return;
    for (let i = 1; i <= count; i++) {
        grid.innerHTML += `
            <div class="work-card">
                <div class="img-container"><img src="${prefix}${i}.jpg" onclick="openFull(this.src)" loading="lazy"></div>
                <div class="work-info"><h3 class="work-title">${titleBase} №${i}</h3></div>
            </div>`;
    }
}

function setLang(lang) {
    Object.keys(texts[lang]).forEach(id => {
        const element = document.getElementById(id);
        if (element) element.innerText = texts[lang][id];
    });
}

function openFull(src) {
    document.getElementById('fullImg').src = src;
    document.getElementById('fullView').style.display = 'flex';
}

// Запуск генерации карточек
createCards('weddingGrid', 'work', 8, 'Торт');
createCards('kidsGrid', 'kids', 45, 'Торт');

setLang('ru');
</script>
</body>
</html>
