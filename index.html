<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UliBakery | Профессиональная кондитерская студия</title>
    <meta name="description" content="Эксклюзивные торты на заказ в Вантаа и Хельсинки. Свадебные, детские и праздничные десерты в UliBakery.">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: #5d4037;
            background-color: #fff6f8;
            background-image: 
                radial-gradient(#fbc2eb 12%, transparent 12%),
                linear-gradient(135deg, #f8e1eb 0%, #e8f5e9 100%);
            background-size: 35px 35px, 100% 100%;
            background-attachment: fixed;
            overflow-x: hidden;
        }
        .floating-sweet {
            position: fixed;
            font-size: 35px;
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }
        .sweet-1 { animation: bounceX1 13s linear infinite alternate, bounceY1 8s linear infinite alternate; }
        .sweet-2 { animation: bounceX2 17s linear infinite alternate, bounceY2 10s linear infinite alternate; }
        @keyframes bounceX1 { from { left: 0; } to { left: calc(100vw - 50px); } }
        @keyframes bounceX2 { from { left: calc(100vw - 50px); } to { left: 0; } }
        @keyframes bounceY1 { from { top: 0; } to { top: calc(100vh - 50px); } }
        @keyframes bounceY2 { from { top: calc(100vh - 50px); } to { top: 0; } }

        /* Новый весенне-пасхальный декор */
        .spring-deco {
            position: fixed;
            font-size: 28px;
            opacity: 0.18;
            z-index: 2;
            pointer-events: none;
            animation: floatSpring 18s linear infinite;
        }
        @keyframes floatSpring {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .top-bar {
            background: #fffafa;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fce4ec;
            position: relative;
            z-index: 10001;
        }
        .social-links { display: flex; align-items: center; gap: 15px; }
        .social-links a svg { width: 26px; height: 26px; fill: #ff6f91; transition: 0.3s; }
        .social-links a:hover svg { transform: scale(1.2); }
        .lang button {
            background:#fff;
            border:1px solid #ffb2c1;
            padding: 5px 10px;
            border-radius: 6px;
            cursor:pointer;
            font-weight:bold;
            margin-left: 5px;
            color: #333;
        }
        .lang button:hover { background: #fbc2eb; color: white; }
        .content-wrapper {
            max-width: 1050px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 50px rgba(251, 194, 235, 0.3);
            min-height: 100vh;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #fffafa;
            border-bottom: 2px solid #fbc2eb;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            min-height: 280px;
        }
        .header-left { flex: 1.4; min-width: 320px; height: 280px; overflow: hidden; }
        .header-left img { width: 100%; height: 100%; object-fit: cover; }
        .header-right {
            flex: 0.6;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .logo-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #fbc2eb;
            margin-bottom: 10px;
            object-fit: cover;
            animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        .brand-name {
            font-family: 'Georgia', serif;
            font-size: 34px;
            color: #ff6f91;
            font-weight: bold;
        }
        .welcome-section {
            padding: 60px 40px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .main-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .menu-card {
            background: white;
            padding: 35px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: #5d4037;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #fce4ec;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(251, 194, 235, 0.1);
        }
        .menu-card:hover {
            transform: translateY(-8px);
            background: #ff6f91;
            color: white;
            border-color: #ff6f91;
            box-shadow: 0 10px 25px rgba(255, 111, 145, 0.3);
        }
        .menu-card.special {
            background: linear-gradient(135deg, #ff6f91, #ff9eb8);
            color: white;
            border: 3px solid #fff;
            position: relative;
            overflow: hidden;
            font-size: 19px;
        }
        .menu-card.special::after {
            content: "✨";
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 32px;
            opacity: 0.9;
        }
        .menu-card.special:hover {
            transform: translateY(-12px) scale(1.04);
            box-shadow: 0 20px 35px rgba(255, 111, 145, 0.45);
        }
        footer {
            background:#fbc2eb;
            padding:30px;
            text-align: center;
            font-weight: bold;
            color: #5d4037;
        }
    </style>
</head>
<body>

    <!-- Плавающие сладости -->
    <div class="floating-sweet sweet-1">🧁</div>
    <div class="floating-sweet sweet-2">🍰</div>

    <!-- Новый весенне-пасхальный декор -->
    <div class="spring-deco" style="top: 15%; left: 8%; animation-delay: 0s;">🌸</div>
    <div class="spring-deco" style="top: 25%; right: 12%; animation-delay: 3s; font-size: 32px;">🥚</div>
    <div class="spring-deco" style="top: 45%; left: 18%; animation-delay: 7s;">🌷</div>
    <div class="spring-deco" style="top: 60%; right: 15%; animation-delay: 2s; font-size: 38px;">🐰</div>
    <div class="spring-deco" style="bottom: 25%; left: 10%; animation-delay: 5s;">🌿</div>
    <div class="spring-deco" style="bottom: 35%; right: 8%; animation-delay: 9s; font-size: 28px;">🌼</div>

    <div class="content-wrapper">
        <div class="top-bar">
            <div class="social-links">
                <a href="https://www.instagram.com/uli_bakery" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61555581029318" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24">
                        <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-8.74h-2.94v-3.403h2.94v-2.511c0-2.91 1.777-4.494 4.376-4.494 1.246 0 2.316.092 2.628.134v3.048l-1.805.001c-1.412 0-1.685.671-1.685 1.656v2.167h3.376l-.44 3.403h-2.936v8.741h6.101c.731 0 1.325-.593 1.325-1.324v-21.351c0-.732-.594-1.325-1.325-1.325z"/>
                    </svg>
                </a>
            </div>
            <div class="lang">
                <button onclick="setLang('fi')">FI</button>
                <button onclick="setLang('ru')">RU</button>
                <button onclick="setLang('en')">EN</button>
            </div>
        </div>

        <header>
            <div class="header-left"><img src="facade.jpg" alt="UliBakery Exterior"></div>
            <div class="header-right">
                <img src="logo.jpg" class="logo-img" alt="UliBakery Logo">
                <div class="brand-name">UliBakery</div>
            </div>
        </header>

        <section class="welcome-section">
            <h1 id="w_title">Профессиональная кондитерская</h1>
           
            <div class="main-menu-grid">
                <a href="vitrina.html" class="menu-card special" id="m_vitrina">ВИТРИНА НА ВЫХОДНЫЕ</a>
                <a href="gallery.html" class="menu-card" id="m_gallery">ГАЛЕРЕЯ</a>
                <a href="order.html" class="menu-card" id="m_order">ЗАКАЗАТЬ ТОРТ</a>
                <a href="about.html" class="menu-card" id="m_about">О НАС</a>
                <a href="reviews.html" class="menu-card" id="m_reviews">ОТЗЫВЫ</a>
                <a href="contacts.html" class="menu-card" id="m_contacts">КОНТАКТЫ</a>
            </div>
        </section>

        <footer id="footer_text">
            © 2026 UliBakery — С любовью к каждому десерту
        </footer>
    </div>

    <script>
        const translations = {
            ru: {
                title: "Профессиональная кондитерская",
                m_vitrina: "ВИТРИНА НА ВЫХОДНЫЕ",
                m_gallery: "ГАЛЕРЕЯ",
                m_order: "ЗАКАЗАТЬ ТОРТ",
                m_about: "О НАС",
                m_reviews: "ОТЗЫВЫ",
                m_contacts: "КОНТАКТЫ",
                footer: "© 2026 UliBakery — С любовью к каждому десерту"
            },
            fi: {
                title: "Ammattimainen konditoria",
                m_vitrina: "VIIKONLOPPU VITRIINI",
                m_gallery: "GALLERIA",
                m_order: "TILAA KAKKU",
                m_about: "MEISTÄ",
                m_reviews: "ARVOSTELUT",
                m_contacts: "YHTEYSTIEDOT",
                footer: "© 2026 UliBakery — Rakkaudella jokaiseen leivonnaiseen"
            },
            en: {
                title: "Professional Pastry Studio",
                m_vitrina: "WEEKEND SHOWCASE",
                m_gallery: "GALLERY",
                m_order: "ORDER CAKE",
                m_about: "ABOUT US",
                m_reviews: "REVIEWS",
                m_contacts: "CONTACTS",
                footer: "© 2026 UliBakery — Made with love"
            }
        };

        function setLang(lang) {
            localStorage.setItem('uliLang', lang);
            const t = translations[lang];
            document.getElementById('w_title').innerText = t.title;
            document.getElementById('m_vitrina').innerText = t.m_vitrina;
            document.getElementById('m_gallery').innerText = t.m_gallery;
            document.getElementById('m_order').innerText = t.m_order;
            document.getElementById('m_about').innerText = t.m_about;
            document.getElementById('m_reviews').innerText = t.m_reviews;
            document.getElementById('m_contacts').innerText = t.m_contacts;
            document.getElementById('footer_text').innerText = t.footer;
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('uliLang') || 'ru';
            setLang(savedLang);
        };
    </script>
</body>
</html>
