<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex,nofollow">

  <title>UliBakery Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8eef1;
      color: #503b35;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 184, 205, .35), transparent 30%),
        radial-gradient(circle at 85% 70%, rgba(249, 215, 199, .45), transparent 30%),
        #fff6f8;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 26px;
      padding: 38px;
      box-shadow: 0 20px 50px rgba(103, 61, 74, .15);
      border: 1px solid #f0d5dd;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-brand h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 35px;
      color: #ed5a80;
    }

    .login-brand p {
      margin: 8px 0 0;
      color: #80645c;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid #e5cbd3;
      border-radius: 12px;
      padding: 10px 13px;
      background: #fff;
      color: #503b35;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #ef6f91;
      box-shadow: 0 0 0 3px rgba(239, 111, 145, .12);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 50px;
      padding: 14px 22px;
      margin-top: 22px;
      background: linear-gradient(135deg, #ff7598, #ec5078);
      color: white;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(235, 79, 119, .25);
    }

    .status {
      margin-top: 15px;
      min-height: 20px;
      text-align: center;
      color: #a53f5c;
      font-size: 14px;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 24px;
      background: rgba(255, 250, 249, .96);
      border-bottom: 1px solid #edd4dc;
      backdrop-filter: blur(12px);
    }

    .brand {
      font-family: Georgia, serif;
      color: #ed5a80;
      font-size: 28px;
      font-weight: 700;
    }

    .admin-label {
      color: #8b6e66;
      font-size: 14px;
    }

    .logout-btn {
      border: 1px solid #e6c4ce;
      background: white;
      border-radius: 50px;
      padding: 10px 18px;
      color: #6b4c44;
      font-weight: 700;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 60px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin: 0 0 6px;
      font-size: 29px;
    }

    .welcome p {
      margin: 0;
      color: #7e625a;
    }

    .panel {
      background: white;
      border: 1px solid #eed5dc;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(103, 61, 74, .07);
    }

    .panel h3 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .upload-grid .full {
      grid-column: 1 / -1;
    }

    .file-box {
      border: 2px dashed #edb9c8;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      background: #fff8fa;
    }

    .file-box input {
      border: 0;
      min-height: 0;
      padding: 0;
    }

    .small-note {
      margin-top: 8px;
      font-size: 13px;
      color: #8a716a;
    }

    .upload-btn {
      border: 0;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff7598, #ec5078);
      color: white;
      font-weight: 800;
      padding: 14px 26px;
    }

    .upload-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .gallery-status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .categories {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .category {
      background: white;
      border: 1px solid #eed5dc;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(103, 61, 74, .07);
    }

    .category-head {
      padding: 20px 22px;
      background: linear-gradient(135deg, #fff9f7, #fff0f4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .category-title {
      margin: 0;
      font-size: 21px;
    }

    .category-count {
      color: #8a6b63;
      font-size: 14px;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 18px;
    }

    .photo-card {
      border: 1px solid #eed5dc;
      border-radius: 17px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .photo-wrap {
      aspect-ratio: 1 / 1;
      position: relative;
      background: #f3e9ec;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .cover-badge {
      position: absolute;
      top: 9px;
      left: 9px;
      background: #ed5a80;
      color: white;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 30px;
      box-shadow: 0 4px 12px rgba(0,0,0,.13);
    }

    .hidden-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      background: rgba(72, 58, 54, .88);
      color: white;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 30px;
    }

    .photo-actions {
      display: grid;
      gap: 8px;
      padding: 11px;
    }

    .action-btn {
      min-height: 38px;
      border-radius: 10px;
      border: 1px solid #e8d0d7;
      background: #fff9fa;
      color: #624840;
      font-weight: 700;
      font-size: 13px;
    }

    .action-btn:hover {
      background: #fff0f4;
    }

    .danger {
      color: #ac344e;
      border-color: #efc0cb;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 25px;
      text-align: center;
      color: #92776e;
    }

    .add-category {
      display: flex;
      gap: 12px;
      align-items: end;
    }

    .add-category > div {
      flex: 1;
    }

    .secondary-btn {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid #e6c7d0;
      background: #fff8fa;
      border-radius: 12px;
      font-weight: 800;
      color: #6b4a42;
    }

    .loader {
      text-align: center;
      padding: 45px;
      color: #866860;
    }

    @media (max-width: 900px) {
      .photos {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 20px, 1180px);
        margin-top: 16px;
      }

      .topbar {
        padding: 13px 14px;
      }

      .brand {
        font-size: 22px;
      }

      .admin-label {
        display: none;
      }

      .panel {
        padding: 18px;
      }

      .upload-grid {
        grid-template-columns: 1fr;
      }

      .upload-grid .full {
        grid-column: auto;
      }

      .photos {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
        padding: 10px;
      }

      .category-head {
        padding: 16px;
      }

      .photo-actions {
        padding: 8px;
      }

      .add-category {
        flex-direction: column;
        align-items: stretch;
      }
    }

    @media (max-width: 420px) {
      .photos {
        grid-template-columns: 1fr 1fr;
      }

      .action-btn {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <section id="login-page" class="login-page">
    <div class="login-card">

      <div class="login-brand">
        <h1>UliBakery</h1>
        <p>Hallintapaneeli</p>
      </div>

      <form id="login-form">
        <label for="email">Sähköposti</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="Sähköposti"
        >

        <label for="password">Salasana</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Salasana"
        >

        <button class="primary-btn" type="submit">
          Kirjaudu sisään
        </button>

        <div id="login-status" class="status"></div>
      </form>

    </div>
  </section>


  <section id="app" class="app hidden">

    <header class="topbar">
      <div>
        <div class="brand">UliBakery</div>
        <div class="admin-label">Hallintapaneeli</div>
      </div>

      <button id="logout-btn" class="logout-btn">
        Kirjaudu ulos
      </button>
    </header>


    <main class="container">

      <div class="welcome">
        <h2>Galleria</h2>
        <p>Lisää, järjestä ja hallitse UliBakeryn kuvia.</p>
      </div>


      <section class="panel">

        <h3>Lisää uusi kuva</h3>

        <div class="upload-grid">

          <div>
            <label for="category-select">Kategoria</label>
            <select id="category-select"></select>
          </div>

          <div>
            <label for="new-cover">
              <input
                id="new-cover"
                type="checkbox"
                style="width:auto; min-height:auto; margin-right:7px;"
              >
              Aseta kategorian pääkuvaksi
            </label>
          </div>

          <div class="full file-box">
            <input
              id="photo-input"
              type="file"
              accept="image/*"
            >
            <div class="small-note">
              Kuva pienennetään automaattisesti ennen latausta.
            </div>
          </div>

          <div class="full">
            <button id="upload-btn" class="upload-btn">
              Lisää kuva
            </button>

            <div id="gallery-status" class="gallery-status"></div>
          </div>

        </div>

      </section>


      <section class="panel">

        <h3>Lisää uusi kategoria</h3>

        <div class="add-category">

          <div>
            <label for="new-category-name">Suomenkielinen nimi</label>
            <input
              id="new-category-name"
              type="text"
              placeholder="Esim. Cupcakes"
            >
          </div>

          <button id="add-category-btn" class="secondary-btn">
            + Lisää kategoria
          </button>

        </div>

      </section>


      <div id="loading" class="loader">
        Ladataan galleriaa...
      </div>

      <div id="categories" class="categories"></div>

    </main>

  </section>


  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://sxvoigmsosvujeswizib.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IS21B3RawJySN_pAvjX1SA_pWn143P1";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const loginPage = document.getElementById("login-page");
    const app = document.getElementById("app");

    const loginForm = document.getElementById("login-form");
    const loginStatus = document.getElementById("login-status");

    const logoutBtn = document.getElementById("logout-btn");

    const categorySelect = document.getElementById("category-select");
    const photoInput = document.getElementById("photo-input");
    const newCover = document.getElementById("new-cover");
    const uploadBtn = document.getElementById("upload-btn");
    const galleryStatus = document.getElementById("gallery-status");

    const categoriesEl = document.getElementById("categories");
    const loadingEl = document.getElementById("loading");

    const newCategoryName =
      document.getElementById("new-category-name");

    const addCategoryBtn =
      document.getElementById("add-category-btn");


    let categories = [];
    let galleryItems = [];


    function showLogin() {
      loginPage.classList.remove("hidden");
      app.classList.add("hidden");
    }


    function showApp() {
      loginPage.classList.add("hidden");
      app.classList.remove("hidden");
    }


    async function checkSession() {

      const {
        data: { session }
      } = await supabase.auth.getSession();

      if (session) {
        showApp();
        await loadData();
      } else {
        showLogin();
      }
    }


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      loginStatus.textContent = "Kirjaudutaan...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        loginStatus.textContent =
          "Kirjautuminen epäonnistui. Tarkista sähköposti ja salasana.";
        return;
      }

      loginStatus.textContent = "";

      showApp();
      await loadData();
    });


    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });


    async function loadData() {

      loadingEl.classList.remove("hidden");

      const categoriesResponse =
        await supabase
          .from("categories")
          .select("*")
          .order("sort_order", { ascending: true });

      if (categoriesResponse.error) {
        loadingEl.textContent =
          "Kategorioiden lataaminen epäonnistui.";
        return;
      }

      categories = categoriesResponse.data || [];


      const galleryResponse =
        await supabase
          .from("gallery_items")
          .select("*")
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: false });

      if (galleryResponse.error) {
        loadingEl.textContent =
          "Kuvien lataaminen epäonnistui.";
        return;
      }

      galleryItems = galleryResponse.data || [];

      loadingEl.classList.add("hidden");

      renderCategorySelect();
      renderGallery();
    }


    function renderCategorySelect() {

      categorySelect.innerHTML = "";

      for (const category of categories) {

        const option = document.createElement("option");

        option.value = category.id;
        option.textContent = category.name_fi;

        categorySelect.appendChild(option);
      }
    }


    function publicImageUrl(path) {

      const { data } =
        supabase.storage
          .from("gallery")
          .getPublicUrl(path);

      return data.publicUrl;
    }


    function renderGallery() {

      categoriesEl.innerHTML = "";

      if (!categories.length) {
        categoriesEl.innerHTML =
          '<div class="panel">Ei kategorioita.</div>';
        return;
      }


      for (const category of categories) {

        const categoryItems =
          galleryItems.filter(
            item => item.category_id === category.id
          );


        const block = document.createElement("section");
        block.className = "category";


        const head = document.createElement("div");
        head.className = "category-head";

        head.innerHTML = `
          <div>
            <h3 class="category-title">
              ${escapeHtml(category.name_fi)}
            </h3>

            <div class="category-count">
              ${categoryItems.length} kuvaa
            </div>
          </div>
        `;

        block.appendChild(head);


        const photos = document.createElement("div");
        photos.className = "photos";


        if (!categoryItems.length) {

          photos.innerHTML =
            '<div class="empty">Tässä kategoriassa ei ole vielä kuvia.</div>';

        } else {

          for (const item of categoryItems) {

            const card = document.createElement("div");
            card.className = "photo-card";


            const imageUrl =
              publicImageUrl(item.image_path);


            card.innerHTML = `
              <div class="photo-wrap">

                <img
                  src="${imageUrl}"
                  alt=""
                  loading="lazy"
                >

                ${
                  item.is_cover
                    ? '<span class="cover-badge">PÄÄKUVA</span>'
                    : ""
                }

                ${
                  !item.is_visible
                    ? '<span class="hidden-badge">PIILOSSA</span>'
                    : ""
                }

              </div>

              <div class="photo-actions">

                ${
                  item.is_cover
                    ? ""
                    : `
                      <button
                        class="action-btn"
                        data-action="cover"
                        data-id="${item.id}"
                      >
                        Aseta pääkuvaksi
                      </button>
                    `
                }

                <button
                  class="action-btn"
                  data-action="visibility"
                  data-id="${item.id}"
                >
                  ${
                    item.is_visible
                      ? "Piilota kuva"
                      : "Näytä kuva"
                  }
                </button>

                <button
                  class="action-btn danger"
                  data-action="delete"
                  data-id="${item.id}"
                >
                  Poista kuva
                </button>

              </div>
            `;


            photos.appendChild(card);
          }
        }


        block.appendChild(photos);
        categoriesEl.appendChild(block);
      }


      document
        .querySelectorAll("[data-action]")
        .forEach(button => {

          button.addEventListener("click", async () => {

            const id =
              Number(button.dataset.id);

            const action =
              button.dataset.action;

            if (action === "cover") {
              await setCover(id);
            }

            if (action === "visibility") {
              await toggleVisibility(id);
            }

            if (action === "delete") {
              await deletePhoto(id);
            }
          });
        });
    }


    uploadBtn.addEventListener("click", async () => {

      const file = photoInput.files[0];

      if (!file) {
        galleryStatus.textContent =
          "Valitse ensin kuva.";
        return;
      }


      const categoryId =
        Number(categorySelect.value);

      const category =
        categories.find(c => c.id === categoryId);


      if (!category) {
        galleryStatus.textContent =
          "Valitse kategoria.";
        return;
      }


      uploadBtn.disabled = true;
      galleryStatus.textContent =
        "Kuvaa käsitellään ja ladataan...";


      try {

        const resizedBlob =
          await resizeImage(file);


        const fileName =
          `${Date.now()}-${crypto.randomUUID()}.jpg`;

        const path =
          `${category.slug}/${fileName}`;


        const uploadResult =
          await supabase.storage
            .from("gallery")
            .upload(
              path,
              resizedBlob,
              {
                contentType: "image/jpeg",
                upsert: false
              }
            );


        if (uploadResult.error) {
          throw uploadResult.error;
        }


        const wantsCover =
          newCover.checked;


        if (wantsCover) {

          const resetResult =
            await supabase
              .from("gallery_items")
              .update({ is_cover: false })
              .eq("category_id", categoryId);

          if (resetResult.error) {
            throw resetResult.error;
          }
        }


        const insertResult =
          await supabase
            .from("gallery_items")
            .insert({
              category_id: categoryId,
              image_path: path,
              is_cover: wantsCover,
              is_visible: true,
              sort_order: 0
            });


        if (insertResult.error) {

          await supabase.storage
            .from("gallery")
            .remove([path]);

          throw insertResult.error;
        }


        photoInput.value = "";
        newCover.checked = false;

        galleryStatus.textContent =
          "Kuva lisätty onnistuneesti.";

        await loadData();


      } catch (error) {

        console.error(error);

        galleryStatus.textContent =
          "Kuvan lisääminen epäonnistui.";

      } finally {

        uploadBtn.disabled = false;
      }
    });


    async function setCover(id) {

      const item =
        galleryItems.find(i => i.id === id);

      if (!item) return;


      galleryStatus.textContent =
        "Pääkuvaa vaihdetaan...";


      const reset =
        await supabase
          .from("gallery_items")
          .update({ is_cover: false })
          .eq("category_id", item.category_id);


      if (reset.error) {
        galleryStatus.textContent =
          "Pääkuvan vaihtaminen epäonnistui.";
        return;
      }


      const setResult =
        await supabase
          .from("gallery_items")
          .update({
            is_cover: true,
            is_visible: true
          })
          .eq("id", id);


      if (setResult.error) {
        galleryStatus.textContent =
          "Pääkuvan vaihtaminen epäonnistui.";
        return;
      }


      galleryStatus.textContent =
        "Pääkuva vaihdettu.";

      await loadData();
    }


    async function toggleVisibility(id) {

      const item =
        galleryItems.find(i => i.id === id);

      if (!item) return;


      if (item.is_cover && item.is_visible) {

        alert(
          "Pääkuvaa ei voi piilottaa. Valitse ensin toinen pääkuva."
        );

        return;
      }


      const result =
        await supabase
          .from("gallery_items")
          .update({
            is_visible: !item.is_visible
          })
          .eq("id", id);


      if (result.error) {
        alert("Kuvan tilan muuttaminen epäonnistui.");
        return;
      }


      await loadData();
    }


    async function deletePhoto(id) {

      const item =
        galleryItems.find(i => i.id === id);

      if (!item) return;


      const confirmed =
        confirm("Haluatko varmasti poistaa tämän kuvan?");

      if (!confirmed) return;


      const storageResult =
        await supabase.storage
          .from("gallery")
          .remove([item.image_path]);


      if (storageResult.error) {
        alert("Kuvatiedoston poistaminen epäonnistui.");
        return;
      }


      const dbResult =
        await supabase
          .from("gallery_items")
          .delete()
          .eq("id", id);


      if (dbResult.error) {
        alert("Kuvan poistaminen tietokannasta epäonnistui.");
        return;
      }


      await loadData();
    }


    addCategoryBtn.addEventListener("click", async () => {

      const name =
        newCategoryName.value.trim();

      if (!name) {
        alert("Kirjoita kategorian nimi.");
        return;
      }


      const slug =
        createSlug(name);


      const maxOrder =
        categories.reduce(
          (max, category) =>
            Math.max(max, category.sort_order || 0),
          0
        );


      const result =
        await supabase
          .from("categories")
          .insert({
            slug,
            name_fi: name,
            name_ru: name,
            name_en: name,
            sort_order: maxOrder + 10,
            is_visible: true
          });


      if (result.error) {

        console.error(result.error);

        alert(
          "Kategorian lisääminen epäonnistui. Samanniminen kategoria voi jo olla olemassa."
        );

        return;
      }


      newCategoryName.value = "";

      await loadData();
    });


    function createSlug(value) {

      return value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ä/g, "a")
        .replace(/ö/g, "o")
        .replace(/å/g, "a")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        + "-" + Date.now();
    }


    async function resizeImage(file) {

      const bitmap =
        await createImageBitmap(file);


      const MAX_SIZE = 1800;

      let width = bitmap.width;
      let height = bitmap.height;


      if (width > MAX_SIZE || height > MAX_SIZE) {

        const ratio =
          Math.min(
            MAX_SIZE / width,
            MAX_SIZE / height
          );

        width =
          Math.round(width * ratio);

        height =
          Math.round(height * ratio);
      }


      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
      );


      bitmap.close();


      return await new Promise((resolve, reject) => {

        canvas.toBlob(
          blob => {

            if (blob) {
              resolve(blob);
            } else {
              reject(
                new Error("Image conversion failed")
              );
            }

          },
          "image/jpeg",
          0.86
        );
      });
    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    supabase.auth.onAuthStateChange(
      (_event, session) => {

        if (!session) {
          showLogin();
        }
      }
    );


    checkSession();

  </script>
