<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказать торт | UliBakery</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #fff6f8; color: #5d4037; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(251, 194, 235, 0.4); border: 1px solid #fce4ec; position: relative; }
        .lang-switch { text-align: right; margin-bottom: 20px; }
        .lang-switch button { background:#fff; border:1px solid #ffb2c1; padding: 5px 10px; border-radius: 8px; cursor:pointer; font-weight:bold; margin-left: 5px; color: #333; }
        h1 { color: #ff6f91; font-family: 'Georgia', serif; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ff6f91; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #fce4ec; border-radius: 12px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #ff6f91; }
        .order-btn { width: 100%; background: #ff6f91; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .order-btn:hover { background: #e55a7d; transform: translateY(-2px); }
        .order-btn:disabled { background: #ccc; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #ff6f91; font-weight: bold; }
        .error-msg { color: #d32f2f; font-size: 14px; display: none; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button onclick="setLang('fi')">FI</button>
        <button onclick="setLang('ru')">RU</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <h1 id="order_title">Оформить заказ</h1>
    
    <!-- Твоя ссылка Formspree вставлена сюда -->
    <form action="https://formspree.io/f/mjgapyny" method="POST" id="orderForm">
        
        <div class="form-group">
            <label id="lbl_name">Ваше имя</label>
            <input type="text" name="Имя клиента" id="name" required>
        </div>

        <div class="form-group">
            <label id="lbl_email">Ваша почта (для подтверждения)</label>
            <input type="email" name="Email" id="email" required>
        </div>

        <div class="form-group">
            <label id="lbl_type">Тип десерта</label>
            <select name="Тип десерта" id="type"></select>
        </div>

        <div class="form-group">
            <label id="lbl_date">Дата события</label>
            <input type="date" name="Дата заказа" id="date" required onchange="checkDate(this)">
            <div id="date_error" class="error-msg">Извините, эта дата уже занята!</div>
        </div>

        <div class="form-group">
            <label id="lbl_details">Пожелания (начинка, декор)</label>
            <textarea name="Детали заказа" id="details" rows="4"></textarea>
        </div>

        <button type="submit" class="order-btn" id="btn_send">ОТПРАВИТЬ ЗАКАЗ</button>
    </form>
    
    <a href="index.html" class="back-link" id="btn_back">← На главную</a>
</div>

<script>
// --- СПИСОК ЗАНЯТЫХ ДАТ ---
// Просто добавляй даты сюда через запятую в кавычках (ГГГГ-ММ-ДД)
const occupiedDates = [
    '2026-03-20', 
    '2026-03-25'
];

const translations = {
    ru: {
        order_title: "Оформить заказ",
        lbl_name: "Ваше имя",
        lbl_email: "Почта для связи",
        lbl_type: "Что заказываем?",
        types: ["Свадебный торт", "Детский торт", "Капкейки", "Другое"],
        lbl_date: "Дата события",
        lbl_details: "Пожелания (начинка, декор)",
        btn_send: "ОТПРАВИТЬ ЗАКАЗ",
        btn_back: "← На главную",
        date_error: "Извините, эта дата уже занята!"
    },
    fi: {
        order_title: "Tee tilaus",
        lbl_name: "Nimesi",
        lbl_email: "Sähköposti",
        lbl_type: "Jälkiruoan tyyppi",
        types: ["Hääkakku", "Lasten kakku", "Cupcakes", "Muu"],
        lbl_date: "Tapahtuman päivämäärä",
        lbl_details: "Toiveet (täyte, koristelu)",
        btn_send: "LÄHETÄ TILAUS",
        btn_back: "← Takaisin",
        date_error: "Valitettavasti tämä päivä on jo varattu!"
    },
    en: {
        order_title: "Place Order",
        lbl_name: "Your Name",
        lbl_email: "Email Address",
        lbl_type: "Dessert Type",
        types: ["Wedding Cake", "Kids Cake", "Cupcakes", "Other"],
        lbl_date: "Event Date",
        lbl_details: "Wishes (filling, decor)",
        btn_send: "SEND ORDER",
        btn_back: "← Back Home",
        date_error: "Sorry, this date is already booked!"
    }
};

function checkDate(input) {
    const errorDiv = document.getElementById('date_error');
    const submitBtn = document.getElementById('btn_send');
    
    if (occupiedDates.includes(input.value)) {
        errorDiv.style.display = 'block';
        submitBtn.disabled = true;
    } else {
        errorDiv.style.display = 'none';
        submitBtn.disabled = false;
    }
}

function setLang(lang) {
    const t = translations[lang];
    document.getElementById('order_title').innerText = t.order_title;
    document.getElementById('lbl_name').innerText = t.lbl_name;
    document.getElementById('lbl_email').innerText = t.lbl_email;
    document.getElementById('lbl_type').innerText = t.lbl_type;
    document.getElementById('lbl_date').innerText = t.lbl_date;
    document.getElementById('lbl_details').innerText = t.lbl_details;
    document.getElementById('btn_send').innerText = t.btn_send;
    document.getElementById('btn_back').innerText = t.btn_back;
    document.getElementById('date_error').innerText = t.date_error;

    const typeSelect = document.getElementById('type');
    typeSelect.innerHTML = '';
    t.types.forEach(val => {
        let opt = document.createElement('option');
        opt.value = val;
        opt.innerText = val;
        typeSelect.appendChild(opt);
    });
}

// Запуск по умолчанию
setLang('ru');

// Ограничение: нельзя выбрать дату в прошлом
const today = new Date().toISOString().split('T')[0];
document.getElementById('date').setAttribute('min', today);
</script>

</body>
</html>
