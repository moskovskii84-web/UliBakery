<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы | UliBakery</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #fff6f8; color: #5d4037; line-height: 1.6; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; text-align: center; }
        
        /* КНОПКИ ЯЗЫКОВ */
        .lang-switch { text-align: right; margin-bottom: 20px; }
        .lang-switch button { background:#fff; border:1px solid #ffb2c1; padding: 5px 10px; border-radius: 8px; cursor:pointer; font-weight:bold; margin-left: 5px; color: #333; transition: 0.3s; }
        .lang-switch button:hover { background: #fbc2eb; color: white; }

        .back-btn { display: inline-block; background: #5d4037; color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-bottom: 40px; transition: 0.3s; }
        .back-btn:hover { background: #ff6f91; transform: scale(1.05); }

        h1 { font-family: 'Georgia', serif; color: #ff6f91; font-size: 36px; margin-bottom: 40px; }

        .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .review-card { background: white; padding: 30px; border-radius: 25px; border: 1px solid #fce4ec; text-align: left; box-shadow: 0 8px 20px rgba(251, 194, 235, 0.2); transition: 0.3s; }
        .review-card:hover { transform: translateY(-5px); }

        .stars { color: #ffb400; font-size: 22px; margin-bottom: 15px; }
        .author { font-weight: bold; color: #ff6f91; margin-top: 15px; display: block; font-size: 14px; }
        
        .google-btn { 
            display: inline-block; 
            background: #4285F4; 
            color: white; 
            padding: 18px 40px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4); 
            transition: 0.3s;
        }
        .google-btn:hover { background: #357ae8; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-switch">
            <button onclick="changeLang('fi')">FI</button>
            <button onclick="changeLang('ru')">RU</button>
        </div>

        <a href="index.html" class="back-btn" id="btn_back">← НА ГЛАВНУЮ</a>
        
        <h1 id="rev_title">Отзывы наших клиентов</h1>
        
        <div class="reviews-grid" id="reviews_container">
            <!-- Отзывы вставляются через JavaScript -->
        </div>

        <!-- Ссылка на Google Отзывы -->
        <a href="https://www.google.com" 
           target="_blank" 
           class="google-btn" 
           id="btn_google">
            ЧИТАТЬ ВСЕ ОТЗЫВЫ В GOOGLE
        </a>
    </div>

<script>
const translations = {
    ru: {
        back: "← НА ГЛАВНУЮ",
        title: "Отзывы наших клиентов",
        google: "ЧИТАТЬ ВСЕ ОТЗЫВЫ В GOOGLE",
        items: [
            { text: "Самые вкусные торты! Заказывали на день рождения, все гости были в восторге.", author: "Анна С." },
            { text: "Очень нежные десерты и прекрасное оформление. Рекомендую!", author: "Дмитрий" },
            { text: "Лучшая кондитерская! Качество ингредиентов на высоте.", author: "Елена" }
        ]
    },
    fi: {
        back: "← ETUSIVULLE",
        title: "Asiakkaidemme arvostelut",
        google: "LUE KAIKKI ARVOSTELUT GOOGLESTA",
        items: [
            { text: "Parhaat kakut ikinä! Tilasimme syntymäpäiville, kaikki vieraat rakastivat niitä.", author: "Anna S." },
            { text: "Erittäin herkullisia jälkiruokia ja kaunis viimeistely. Suosittelen!", author: "Dmitri" },
            { text: "Paras leipomo! Ainesosien laatu on huippuluokkaa.", author: "Elena" }
        ]
    }
};

function renderReviews(lang) {
    const container = document.getElementById('reviews_container');
    container.innerHTML = '';
    
    translations[lang].items.forEach(item => {
        container.innerHTML += `
            <div class="review-card">
                <div class="stars">★★★★★</div>
                <p>"${item.text}"</p>
                <span class="author">— ${item.author}</span>
            </div>`;
    });
}

function changeLang(lang) {
    localStorage.setItem('uliLang', lang); // Сохраняем язык
    
    // Обновляем тексты на странице
    document.getElementById('btn_back').innerText = translations[lang].back;
    document.getElementById('rev_title').innerText = translations[lang].title;
    document.getElementById('btn_google').innerText = translations[lang].google;
    
    renderReviews(lang);
}

// Инициализация при загрузке
document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('uliLang') || 'ru';
    changeLang(savedLang);
});
</script>

</body>
</html>
