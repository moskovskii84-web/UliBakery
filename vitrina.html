<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Витрина на выходные | UliBakery</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(#fff0f5, #ffe4f0);
            color: #5d4037;
            overflow-x: hidden;
        }
        .top-bar {
            background: rgba(255,255,255,0.95);
            padding: 12px 25px;
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #fce4ec;
        }
        .lang button {
            background: #fff;
            border: 2px solid #ff6f91;
            padding: 8px 14px;
            margin-left: 8px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .lang button.active {
            background: #ff6f91;
            color: white;
        }

        .vitrina-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(255, 111, 145, 0.25);
        }

        .vitrina-header {
            text-align: center;
            padding: 25px 0 15px;
            background: linear-gradient(to right, #ff6f91, #ffb2c1);
            color: white;
            margin: -20px -20px 30px;
            border-radius: 30px 30px 0 0;
        }
        .vitrina-header h1 { margin: 0; font-size: 36px; }
        .vitrina-header p { margin: 8px 0 0; font-size: 18px; opacity: 0.95; }

        .shelf {
            position: relative;
            height: 720px;                    /* подогнал под типичное фото витрины */
            background: url('https://raw.githubusercontent.com/moskovskii84-web/UliBakery/main/%D0%B2%D0%B8%D1%82%D1%80%D0%B8%D0%BD%D0%B0.png') center/cover no-repeat;
            border: 14px solid #fff;
            border-radius: 25px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .item {
            position: absolute;
            width: 175px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .item:hover {
            transform: scale(1.22) rotate(5deg);
            z-index: 20;
        }
        .item img {
            width: 100%;
            height: 175px;
            object-fit: contain;
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.35));
        }
        .item p {
            margin: 8px 0 0;
            font-weight: bold;
            font-size: 15px;
            color: #5d4037;
            text-shadow: 0 1px 4px rgba(255,255,255,0.9);
        }

        /* Позиции тортиков — подстраивай под своё фото */
        #item1 { top: 85px;  left: 9%; }
        #item2 { top: 140px; left: 26%; }
        #item3 { top: 65px;  left: 47%; }
        #item4 { top: 165px; left: 66%; }
        #item5 { top: 95px;  left: 81%; }
        #item6 { top: 205px; left: 13%; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.78); justify-content: center; align-items: center; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255,111,145,0.4);
        }
        .close { position: absolute; top: 15px; right: 25px; font-size: 36px; color: #ff6f91; cursor: pointer; }

        .qty { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 25px 0; font-size: 28px; }
        .qty button {
            width: 50px; height: 50px; background: #ff6f91; color: white; border: none; border-radius: 50%; font-size: 30px; cursor: pointer;
        }

        #cart { margin: 40px 20px 20px; padding: 25px; background: #fffafa; border-radius: 20px; border: 3px solid #fbc2eb; }
        .whatsapp-btn {
            padding: 16px 60px; font-size: 21px; background: #25D366; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 25px rgba(37,211,102,0.35);
        }

        @media (max-width: 768px) {
            .shelf { height: 560px; }
            .item { width: 140px; }
            .item img { height: 140px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang">
            <button onclick="setLang('ru')" id="btn-ru" class="active">RU</button>
            <button onclick="setLang('en')" id="btn-en">EN</button>
            <button onclick="setLang('fi')" id="btn-fi">FI</button>
        </div>
    </div>

    <div class="vitrina-container">
        <div class="vitrina-header">
            <h1 id="title">Витрина на выходные</h1>
            <p id="subtitle">Свежие тортики и пирожные • Выдача в пятницу и субботу</p>
        </div>

        <div class="shelf" id="shelf"></div>

        <div id="cart">
            <h3 id="cart_title">Ваша корзина</h3>
            <div id="cart-items"></div>
            <p id="total">Итого: 0 €</p>
        </div>

        <textarea id="comment" placeholder="Ваши пожелания (без орехов, с надписью и т.д.)" style="width:100%; height:80px; padding:12px; border:2px solid #fbc2eb; border-radius:12px; font-size:16px;"></textarea>
        
        <button class="whatsapp-btn" onclick="sendToWhatsApp()" id="send_btn">📲 Отправить заказ в WhatsApp</button>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <img id="modal-img" style="width:100%; max-height:320px; object-fit:contain; border-radius:15px;">
            <h2 id="modal-name"></h2>
            <p id="modal-price" style="font-size:20px; color:#ff6f91;"></p>
            
            <div class="qty">
                <button onclick="changeQty(-1)">−</button>
                <span id="modal-qty">1</span>
                <button onclick="changeQty(1)">+</button>
            </div>
            
            <button onclick="addToCart()" id="add_btn" style="padding:14px 40px; font-size:18px; background:#ff6f91; color:white; border:none; border-radius:30px;">Добавить в корзину</button>
        </div>
    </div>

    <script>
        // === ПЕРЕВОДЫ ===
        const translations = {
            ru: { title: "Витрина на выходные", subtitle: "Свежие тортики и пирожные • Выдача в пятницу и субботу", cart_title: "Ваша корзина", total: "Итого: ", add: "Добавить в корзину", send: "📲 Отправить заказ в WhatsApp", empty: "Корзина пуста", placeholder: "Ваши пожелания (без орехов, с надписью и т.д.)" },
            en: { title: "Weekend Showcase", subtitle: "Fresh cakes & pastries • Pickup Friday & Saturday", cart_title: "Your cart", total: "Total: ", add: "Add to cart", send: "📲 Send to WhatsApp", empty: "Cart is empty", placeholder: "Your wishes..." },
            fi: { title: "Viikonloppu Vitriini", subtitle: "Tuoreet kakut • Nouto pe ja la", cart_title: "Ostoskori", total: "Yhteensä: ", add: "Lisää koriin", send: "📲 Lähetä WhatsAppiin", empty: "Kori on tyhjä", placeholder: "Toiveesi..." }
        };

        const products = [
            { id: "choco",  name: {ru:"Шоколадный торт", en:"Chocolate Cake", fi:"Suklaakakku"}, price:5, img:"https://i.pinimg.com/736x/21/1e/d8/211ed885e8bc6393c0ef8fa12c8c76e2.jpg" },
            { id: "mohito", name: {ru:"Мохито-лайм", en:"Mojito-Lime", fi:"Mojito-Lime"}, price:5, img:"https://i.pinimg.com/736x/d0/39/dc/d039dc29e54308d0571fa059f4aa454c.jpg" },
            { id: "straw",  name: {ru:"Клубничный", en:"Strawberry", fi:"Mansikkakakku"}, price:5, img:"https://picsum.photos/id/201/600/500" },
            { id: "lemon",  name: {ru:"Лимонный", en:"Lemon Cake", fi:"Sitruunakakku"}, price:5, img:"https://picsum.photos/id/292/600/500" },
            { id: "rasp",   name: {ru:"Малиновый", en:"Raspberry", fi:"Vadelmakakku"}, price:5, img:"https://picsum.photos/id/431/600/500" },
            { id: "oreo",   name: {ru:"Oreo", en:"Oreo Cake", fi:"Oreo-kakku"}, price:5, img:"https://picsum.photos/id/870/600/500" }
        ];

        let currentLang = 'ru';
        let currentItem = {};
        let cart = {};

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.id === `btn-${lang}`));
            
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('subtitle').innerText = translations[lang].subtitle;
            document.getElementById('cart_title').innerText = translations[lang].cart_title;
            document.getElementById('add_btn').innerText = translations[lang].add;
            document.getElementById('send_btn').innerText = translations[lang].send;
            document.getElementById('comment').placeholder = translations[lang].placeholder;

            renderVitrina();
            updateCart();
        }

        function renderVitrina() {
            const shelf = document.getElementById('shelf');
            shelf.innerHTML = '';
            products.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.id = `item${i+1}`;
                div.innerHTML = `<img src="${p.img}" alt="${p.name[currentLang]}"><p>${p.name[currentLang]} — ${p.price} €</p>`;
                div.onclick = () => openModal(p);
                shelf.appendChild(div);
            });
        }

        function openModal(p) {
            currentItem = {...p, qty:1};
            document.getElementById('modal-img').src = p.img;
            document.getElementById('modal-name').innerText = p.name[currentLang];
            document.getElementById('modal-price').innerText = `${p.price} € / шт`;
            document.getElementById('modal-qty').innerText = 1;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function changeQty(d) { currentItem.qty = Math.max(1, currentItem.qty + d); document.getElementById('modal-qty').innerText = currentItem.qty; }

        function addToCart() {
            cart[currentItem.id] = {...currentItem};
            updateCart();
            closeModal();
        }

        function updateCart() {
            let html = '', total = 0;
            for (let key in cart) {
                let item = cart[key];
                let sum = item.qty * item.price;
                total += sum;
                html += `<p>${item.name[currentLang]} × ${item.qty} = ${sum} €</p>`;
            }
            document.getElementById('cart-items').innerHTML = html || `<p>${translations[currentLang].empty}</p>`;
            document.getElementById('total').innerText = `${translations[currentLang].total}${total} €`;
        }

        function sendToWhatsApp() {
            let msg = currentLang === 'ru' ? "Привет! Заказ с витрины:\n\n" : currentLang === 'en' ? "Hi! Order from showcase:\n\n" : "Hei! Tilaus vitriinistä:\n\n";
            for (let key in cart) msg += `${cart[key].name[currentLang]} — ${cart[key].qty} шт\n`;
            let comm = document.getElementById('comment').value.trim();
            if (comm) msg += `\nПожелания: ${comm}\n`;
            msg += currentLang === 'ru' ? "\nСпасибо ❤️" : "\nThank you ❤️";

            const phone = "358XXXXXXXXX";   // ← Замени на свой номер!
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = () => setLang('ru');
    </script>
</body>
</html>
