<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрина | UliBakery</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#fff6f8;
    color:#5d4037;
}

.top-bar {
    display:flex;
    justify-content:space-between;
    padding:10px 15px;
    background:white;
}

.back-link { color:#ff6f91; text-decoration:none; font-weight:bold; }

.lang button {
    border:1px solid #ffb2c1;
    background:white;
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
}

.lang .active { background:#ff6f91; color:white; }

.container {
    max-width:1200px;
    margin:auto;
    padding:15px;
}

h1 {
    text-align:center;
    color:#ff6f91;
}

.products-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:15px;
}

.product-card {
    background:white;
    border-radius:20px;
    padding:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(251,194,235,0.4);
    cursor:pointer;
    transition:0.3s;
}
.product-card:hover { transform:translateY(-5px); }

.product-card img {
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:12px;
}

.price {
    color:#ff6f91;
    font-weight:bold;
    margin:5px 0;
}

.cart {
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:20px;
}

.qty-btn {
    background:#ff6f91;
    color:white;
    border:none;
    border-radius:50%;
    width:30px;
    height:30px;
    cursor:pointer;
}

.input {
    width:100%;
    padding:12px;
    margin-top:10px;
}

.submit {
    width:100%;
    padding:15px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-size:18px;
}

.modal {
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-box {
    background:white;
    padding:20px;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="top-bar">
<a href="index.html" class="back-link">← На главную</a>

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('fi')">FI</button>
<button onclick="setLang('en')">EN</button>
</div>
</div>

<div class="container">
<h1>Витрина на выходные</h1>

<div id="products" class="products-grid"></div>

<div class="cart">
<h3>Корзина</h3>
<div id="cart"></div>
<b id="total">0 €</b>

<form id="orderForm" action="https://formspree.io/f/mjgapyny" method="POST">
<input type="email" name="email" placeholder="Ваш Email" class="input" required>

<input type="hidden" name="order" id="hiddenOrder">
<input type="hidden" name="total" id="hiddenTotal">

<button class="submit">ОТПРАВИТЬ ЗАКАЗ</button>
</form>
</div>
</div>

<div id="modal" class="modal">
<div class="modal-box">
<h3 id="m_name"></h3>
<button onclick="changeQty(-1)">-</button>
<span id="m_qty">1</span>
<button onclick="changeQty(1)">+</button>
<br><br>
<button onclick="addToCart()">Добавить</button>
</div>
</div>

<script>
const products = [
{id:"p1",name:{ru:"Будапешт",fi:"Budapest",en:"Budapest"},price:4.5,img:"budapest.jpg"},
{id:"p2",name:{ru:"Ваниль",fi:"Vanilja",en:"Vanilla"},price:4.5,img:"vanilja.jpg"},
{id:"p3",name:{ru:"Клубничный торт",fi:"Mansikkakakku",en:"Strawberry"},price:3.8,img:"mansikkakermakakku.jpg"},
{id:"p4",name:{ru:"Мохито-лайм",fi:"Mohito",en:"Mohito"},price:6.3,img:"mohitolime.jpg"},
{id:"p5",name:{ru:"Вафля",fi:"Vohveli",en:"Waffle"},price:3.5,img:"vohveli.jpg"},
{id:"p6",name:{ru:"Наполеон",fi:"Napoleon",en:"Napoleon"},price:4.5,img:"napoleon.jpg"},
{id:"p7",name:{ru:"Красный бархат",fi:"Red Velvet",en:"Red Velvet"},price:6.3,img:"red-velvet.jpg"},
{id:"p8",name:{ru:"Шоколадный",fi:"Suklaa",en:"Chocolate"},price:6.5,img:"sukla.jpg"},
{id:"p9",name:{ru:"Орешки",fi:"Pähkinät",en:"Nuts"},price:1.5,img:"keksi.jpg"},
{id:"p10",name:{ru:"Кейк-попс",fi:"Cake Pop",en:"Cake Pop"},price:2.5,img:"cake-pops.jpg"}
];

let cart = {};
let temp = null;

function render(){
let box=document.getElementById('products');
box.innerHTML='';

products.forEach(p=>{
let div=document.createElement('div');
div.className='product-card';
div.onclick=()=>openModal(p);

div.innerHTML=`
<img src="${p.img}" onerror="this.src='https://via.placeholder.com'">
<h3>${p.name.ru}</h3>
<div class="price">${p.price}€</div>
`;

box.appendChild(div);
});
}

function openModal(p){
temp={...p,qty:1};
document.getElementById('m_name').innerText=p.name.ru;
document.getElementById('modal').style.display='flex';
}

function changeQty(d){
temp.qty=Math.max(1,temp.qty+d);
document.getElementById('m_qty').innerText=temp.qty;
}

function addToCart(){
if(!cart[temp.id]) cart[temp.id]={...temp,qty:0};
cart[temp.id].qty+=temp.qty;
document.getElementById('modal').style.display='none';
updateCart();
}

function updateCart(){
let box=document.getElementById('cart');
box.innerHTML='';
let total=0;
let text='';

for(let id in cart){
let i=cart[id];
let sum=i.qty*i.price;
total+=sum;
text+=i.name.ru+" x"+i.qty+"; ";

box.innerHTML+=`
<div>
${i.name.ru} x${i.qty}
<button onclick="cart['${id}'].qty--; updateCart()">-</button>
</div>`;
}

document.getElementById('total').innerText=total+"€";
document.getElementById('hiddenOrder').value=text;
document.getElementById('hiddenTotal').value=total+"€";
}

document.getElementById('orderForm').addEventListener('submit', async function(e){
e.preventDefault();

if(Object.keys(cart).length===0){
alert("Добавьте товары!");
return;
}

const form=e.target;
const data=new FormData(form);

await fetch(form.action,{
method:"POST",
body:data,
headers:{'Accept':'application/json'}
});

window.location.href="thankyou.html";
});

render();
</script>

</body>
</html>
