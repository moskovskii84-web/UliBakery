<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витрина на выходные | UliBakery</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(#fff0f5, #ffe4f0); color: #5d4037; }
        .top-bar { background: rgba(255,255,255,0.95); padding: 12px 25px; display: flex; justify-content: flex-end; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #fce4ec; }
        .lang button { background: #fff; border: 2px solid #ff6f91; padding: 8px 14px; margin-left: 8px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .lang button.active { background: #ff6f91; color: white; }
        .vitrina-container { max-width: 1350px; margin: 30px auto; padding: 20px; background: white; border-radius: 30px; box-shadow: 0 15px 50px rgba(255,111,145,0.3); }
        .vitrina-header { text-align: center; padding: 30px 0 20px; background: linear-gradient(to right, #ff6f91, #ffb2c1); color: white; margin: -20px -20px 40px; border-radius: 30px 30px 0 0; }
        .shelf { position: relative; height: 1080px; background: url('https://raw.githubusercontent.com') center/cover no-repeat; border: 22px solid #fff; border-radius: 35px; overflow: hidden; }
        .item { position: absolute; width: 205px; text-align: center; cursor: pointer; transition: 0.3s; }
        .item:hover { transform: scale(1.1); z-index: 10; }
        .item img { width: 100%; height: 205px; object-fit: contain; border-radius: 12px; }
        .price { display: inline-block; background: #ff6f91; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; margin-top: 5px; }
        
        /* Позиции товаров */
        #item1 { top: 165px; left: 6%; } #item2 { top: 170px; left: 27%; }
        #item3 { top: 165px; left: 48%; } #item4 { top: 165px; left: 70%; }
        #item5 { top: 490px; left: 7%; } #item6 { top: 485px; left: 29%; }
        #item7 { top: 485px; left: 51%; } #item8 { top: 485px; left: 73%; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 25px; max-width: 400px; text-align: center; position: relative; }
        .close { position: absolute; top: 10px; right: 20px; font-size: 30px; cursor: pointer; color: #ff6f91; }
        .qty { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .qty button { width: 40px; height: 40px; background: #ff6f91; color: white; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; }
        
        #cart { margin-top: 30px; padding: 20px; border: 2px solid #fbc2eb; border-radius: 20px; background: #fffafa; }
        .mail-btn { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; margin-top: 10px; border: 2px solid #fbc2eb; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="lang">
        <button onclick="setLang('ru')" id="btn-ru">RU</button>
        <button onclick="setLang('fi')" id="btn-fi">FI</button>
        <button onclick="setLang('en')" id="btn-en">EN</button>
    </div>
</div>

<div class="vitrina-container">
    <div class="vitrina-header">
        <h1 id="title">Витрина на выходные</h1>
        <p id="subtitle">Свежие десерты • Пт-Сб</p>
    </div>

    <div class="shelf" id="shelf"></div>

    <div id="cart">
        <h3 id="cart_title">Корзина</h3>
        <div id="cart-items"><p>Корзина пуста</p></div>
        <hr>
        <b id="total">Итого: 0.00 €</b>
    </div>

    <input type="email" id="email" class="input-field" placeholder="Ваш Email для связи" required>
    <textarea id="comment" class="input-field" placeholder="Пожелания к заказу..." rows="3"></textarea>
    <button class="mail-btn" onclick="sendToFormspree()" id="send_btn">✉️ ОТПРАВИТЬ ЗАКАЗ</button>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modal-img" style="width:100%; border-radius:15px;">
        <h2 id="modal-name"></h2>
        <p id="modal-price"></p>
        <div class="qty">
            <button onclick="changeQty(-1)">−</button>
            <b id="modal-qty">1</b>
            <button onclick="changeQty(1)">+</button>
        </div>
        <button onclick="addToCart()" id="add_btn" style="padding:10px 30px; background:#ff6f91; color:white; border:none; border-radius:20px; cursor:pointer;">Добавить</button>
    </div>
</div>

<script>
    const products = [
        { id: "budapest", name: {ru:"Будапешт", fi:"Budapest", en:"Budapest"}, price: 4.50, img: "budapest.jpg" },
        { id: "vanilja",  name: {ru:"Ваниль", fi:"Vanilja", en:"Vanilla"}, price: 4.50, img: "vanilja.jpg" },
        { id: "mansikka", name: {ru:"Клубничный торт", fi:"Mansikkakakku", en:"Strawberry Cake"}, price: 3.80, img: "mansikkakermakakku.jpg" },
        { id: "mohito",   name: {ru:"Мохито-лайм", fi:"Mohito-lime", en:"Mohito-lime"}, price: 6.30, img: "mohitolime.jpg" },
        { id: "vohveli",  name: {ru:"Вафля", fi:"Vohveli", en:"Waffle"}, price: 3.50, img: "vohveli.jpg" },
        { id: "napoleon", name: {ru:"Наполеон", fi:"Napoleon", en:"Napoleon"}, price: 4.50, img: "napoleon.jpg" },
        { id: "redvelvet",name: {ru:"Красный бархат", fi:"Red Velvet", en:"Red Velvet"}, price: 6.30, img: "red-velvet.jpg" },
        { id: "suklaa",   name: {ru:"Шоколадный торт", fi:"Suklaakakku", en:"Chocolate Cake"}, price: 6.50, img: "sukla.jpg" }
    ];

    const ui = {
        ru: { title: "Витрина на выходные", cart: "Ваша корзина", empty: "Корзина пуста", total: "Итого", send: "ОТПРАВИТЬ ЗАКАЗ", alert: "Заказ отправлен!", email: "Ваш Email" },
        fi: { title: "Viikonlopun vitriini", cart: "Ostoskori", empty: "Ostoskori on tyhjä", total: "Yhteensä", send: "LÄHETÄ TILAUS", alert: "Tilaus lähetetty!", email: "Sähköpostisi" },
        en: { title: "Weekend Showcase", cart: "Your Cart", empty: "Cart is empty", total: "Total", send: "SEND ORDER", alert: "Order sent!", email: "Your Email" }
    };

    let currentLang = 'ru';
    let cart = {};
    let currentItem = null;

    function setLang(lang) {
        currentLang = lang;
        document.getElementById('title').innerText = ui[lang].title;
        document.getElementById('cart_title').innerText = ui[lang].cart;
        document.getElementById('send_btn').innerText = ui[lang].send;
        document.getElementById('email').placeholder = ui[lang].email;
        
        document.querySelectorAll('.lang button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${lang}`).classList.add('active');
        
        renderVitrina();
        updateCart();
    }

    function renderVitrina() {
        const shelf = document.getElementById('shelf');
        shelf.innerHTML = '';
        products.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = `item${i+1}`;
            div.innerHTML = `
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com'">
                <p><b>${p.name[currentLang]}</b><br><span class="price">${p.price.toFixed(2)} €</span></p>
            `;
            div.onclick = () => openModal(p);
            shelf.appendChild(div);
        });
    }

    function openModal(p) {
        currentItem = {...p, qty: 1};
        document.getElementById('modal-img').src = p.img;
        document.getElementById('modal-name').innerText = p.name[currentLang];
        document.getElementById('modal-price').innerText = `${p.price.toFixed(2)} €`;
        document.getElementById('modal-qty').innerText = 1;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    function changeQty(delta) {
        currentItem.qty = Math.max(1, currentItem.qty + delta);
        document.getElementById('modal-qty').innerText = currentItem.qty;
    }

    function addToCart() {
        if (cart[currentItem.id]) cart[currentItem.id].qty += currentItem.qty;
        else cart[currentItem.id] = {...currentItem};
        updateCart();
        closeModal();
    }

    function updateCart() {
        let html = '', total = 0;
        for (let id in cart) {
            let item = cart[id];
            let sum = item.price * item.qty;
            total += sum;
            html += `<p>${item.name[currentLang]} x ${item.qty} = ${sum.toFixed(2)} €</p>`;
        }
        document.getElementById('cart-items').innerHTML = html || `<p>${ui[currentLang].empty}</p>`;
        document.getElementById('total').innerText = `${ui[currentLang].total}: ${total.toFixed(2)} €`;
    }

    async function sendToFormspree() {
        const email = document.getElementById('email').value;
        if (!email) { alert("Укажите Email!"); return; }
        if (Object.keys(cart).length === 0) { alert(ui[currentLang].empty); return; }

        let orderList = Object.values(cart).map(i => `${i.name[currentLang]} x${i.qty}`).join(', ');
        
        const formData = new FormData();
        formData.append("Email", email);
        formData.append("Заказ", orderList);
        formData.append("Итого", document.getElementById('total').innerText);
        formData.append("Комментарий", document.getElementById('comment').value);

        const btn = document.getElementById('send_btn');
        btn.disabled = true;
        btn.innerText = "...";

        try {
            const response = await fetch("https://formspree.io", {
                method: "POST",
                body: formData,
                headers: { 'Accept': 'application/json' }
            });
            if (response.ok) {
                alert(ui[currentLang].alert);
                cart = {};
                updateCart();
                document.getElementById('comment').value = '';
            }
        } catch (e) { alert("Error!"); }
        finally { btn.disabled = false; btn.innerText = ui[currentLang].send; }
    }

    window.onload = () => setLang('ru');
</script>

</body>
</html>
