<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрина | UliBakery</title>

<style>
body { margin:0; font-family:'Segoe UI'; background:#fff6f8; }

.shelf {
    width:100%;
    height:600px;
    background:#eee;
    position:relative;
    border-radius:20px;
}

.item {
    position:absolute;
    width:140px;
    cursor:pointer;
    transition:.3s;
}
.item:hover { transform:scale(1.1); }

.price-tag {
    background:#ff6f91;
    color:white;
    padding:4px 10px;
    border-radius:10px;
}

#item1{top:15%;left:10%;}
#item2{top:15%;left:35%;}
#item3{top:15%;left:60%;}
#item4{top:15%;left:80%;}
#item5{top:55%;left:10%;}
#item6{top:55%;left:35%;}
#item7{top:55%;left:60%;}
#item8{top:55%;left:80%;}

#cart {
    margin-top:30px;
    padding:20px;
    background:white;
    border-radius:20px;
}

.btn-send {
    width:100%;
    padding:16px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.input-field {
    width:100%;
    padding:12px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1 style="text-align:center;color:#ff6f91;">Витрина</h1>

<div class="shelf" id="shelf"></div>

<div id="cart">
<h3>Корзина</h3>
<div id="cart-items"></div>
<b id="total">Итого: 0 €</b>

<form id="orderForm" action="https://formspree.io/f/mjgapyny" method="POST">
<input type="email" name="email" placeholder="Email" class="input-field" required>

<input type="hidden" name="order" id="hiddenOrder">
<input type="hidden" name="total" id="hiddenTotal">

<button class="btn-send">Отправить заказ</button>
</form>
</div>

<script>
const products = [
{id:"p1",name:"Будапешт",price:4.5,img:"budapest.jpg"},
{id:"p2",name:"Ваниль",price:4.5,img:"vanilja.jpg"},
{id:"p3",name:"Клубника",price:3.8,img:"mansikkakermakakku.jpg"},
{id:"p4",name:"Мохито",price:6.3,img:"mohitolime.jpg"},
{id:"p5",name:"Вафля",price:3.5,img:"vohveli.jpg"},
{id:"p6",name:"Наполеон",price:4.5,img:"napoleon.jpg"},
{id:"p7",name:"Red Velvet",price:6.3,img:"red-velvet.jpg"},
{id:"p8",name:"Шоколад",price:6.5,img:"sukla.jpg"}
];

let cart = {};

function render() {
const shelf = document.getElementById('shelf');
shelf.innerHTML = '';

products.forEach((p,i)=>{
const el = document.createElement('div');
el.className='item';
el.id='item'+(i+1);

el.innerHTML = `
<img src="${p.img}" width="100%">
<div class="price-tag">${p.price}€</div>
`;

el.onclick = ()=>add(p);
shelf.appendChild(el);
});
}

function add(p){
if(!cart[p.id]) cart[p.id]={...p,qty:0};
cart[p.id].qty++;
update();
}

function remove(id){
cart[id].qty--;
if(cart[id].qty<=0) delete cart[id];
update();
}

function update(){
const box = document.getElementById('cart-items');
box.innerHTML='';

let total=0;
let text='';

for(let id in cart){
let item=cart[id];
let sum=item.qty*item.price;
total+=sum;

text+=`${item.name} x${item.qty} (${sum}€); `;

box.innerHTML+=`
<div>
${item.name} x${item.qty}
<button onclick="remove('${id}')">-</button>
</div>`;
}

document.getElementById('total').innerText="Итого: "+total+"€";
document.getElementById('hiddenOrder').value=text;
document.getElementById('hiddenTotal').value=total+"€";
}

document.getElementById('orderForm').addEventListener('submit', async function(e){
e.preventDefault();

if(Object.keys(cart).length===0){
alert("Добавьте товар");
return;
}

const form = e.target;
const data = new FormData(form);

await fetch(form.action,{
method:"POST",
body:data,
headers:{'Accept':'application/json'}
});

// редирект
window.location.href="thankyou.html";
});

render();
</script>

</body>
</html>
