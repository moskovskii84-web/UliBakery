<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Витрина на выходные | UliBakery</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(#fff0f5, #ffe4f0);
            color: #5d4037;
        }
        .top-bar {
            background: rgba(255,255,255,0.95);
            padding: 12px 25px;
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #fce4ec;
        }
        .lang button {
            background: #fff;
            border: 2px solid #ff6f91;
            padding: 8px 14px;
            margin-left: 8px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .lang button.active { background: #ff6f91; color: white; }

        .vitrina-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(255,111,145,0.3);
        }

        .vitrina-header {
            text-align: center;
            padding: 30px 0 20px;
            background: linear-gradient(to right, #ff6f91, #ffb2c1);
            color: white;
            margin: -20px -20px 40px;
            border-radius: 30px 30px 0 0;
        }
        .vitrina-header h1 { margin: 0; font-size: 39px; }
        .vitrina-header p { margin: 10px 0 0; font-size: 19px; }

        /* Ещё больше витрина + лучшее позиционирование */
        .shelf {
            position: relative;
            height: 920px;                    /* Сделали выше */
            background: url('https://raw.githubusercontent.com/moskovskii84-web/UliBakery/main/%D0%B2%D0%B8%D1%82%D1%80%D0%B8%D0%BD%D0%B0.png') center/cover no-repeat;
            border: 20px solid #fff;
            border-radius: 32px;
            box-shadow: inset 0 0 110px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .item {
            position: absolute;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .item:hover { transform: scale(1.22) rotate(5deg); z-index: 30; }

        .item img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 12px;
        }
        .item p {
            margin: 10px 0 0;
            font-weight: bold;
            font-size: 16.8px;
            line-height: 1.3;
        }
        .item .price {
            color: #ff6f91;
            font-size: 18px;
            font-weight: bold;
        }

        /* Более аккуратная и сгруппированная расстановка */
        #item1 { top: 85px; left: 5%; }     /* Budapest / Pavlova */
        #item2 { top: 92px; left: 26%; }    /* Vanilja */
        #item3 { top: 165px; left: 8%; }    /* Mansikkakakku */
        #item4 { top: 78px; left: 48%; }    /* Mohito-lime */
        #item5 { top: 185px; left: 45%; }   /* Vohveli */
        #item6 { top: 85px; left: 70%; }    /* Napoleon */
        #item7 { top: 175px; left: 68%; }   /* Red Velvet */
        #item8 { top: 95px; left: 87%; }    /* Suklaakakku */

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.78);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 28px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 65px rgba(255,111,145,0.45);
        }
        .close { position: absolute; top: 15px; right: 25px; font-size: 40px; color: #ff6f91; cursor: pointer; }

        .qty { display: flex; justify-content: center; align-items: center; gap: 25px; margin: 25px 0; font-size: 30px; }
        .qty button { width: 55px; height: 55px; background: #ff6f91; color: white; border: none; border-radius: 50%; font-size: 34px; cursor: pointer; }

        #cart { margin: 45px 20px 25px; padding: 25px; background: #fffafa; border-radius: 20px; border: 3px solid #fbc2eb; }
        .whatsapp-btn { padding: 17px 70px; font-size: 21px; background: #25D366; color: white; border: none; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang">
            <button onclick="setLang('ru')" id="btn-ru" class="active">RU</button>
            <button onclick="setLang('en')" id="btn-en">EN</button>
            <button onclick="setLang('fi')" id="btn-fi">FI</button>
        </div>
    </div>

    <div class="vitrina-container">
        <div class="vitrina-header">
            <h1 id="title">Витрина на выходные</h1>
            <p id="subtitle">Свежие десерты • Выдача: Пт 15:00–18:00 | Сб 10:00–14:00</p>
        </div>

        <div class="shelf" id="shelf"></div>

        <div id="cart">
            <h3 id="cart_title">Ваша корзина</h3>
            <div id="cart-items"></div>
            <p id="total">Итого: 0 €</p>
        </div>

        <textarea id="comment" placeholder="Ваши пожелания..." style="width:100%; height:90px; padding:14px; border:2px solid #fbc2eb; border-radius:12px; font-size:16px;"></textarea>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()" id="send_btn">📲 Отправить заказ в WhatsApp</button>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <img id="modal-img" style="width:100%; max-height:350px; object-fit:contain; border-radius:15px;">
            <h2 id="modal-name"></h2>
            <p id="modal-price" style="font-size:22px; color:#ff6f91; margin:10px 0;"></p>
            <div class="qty">
                <button onclick="changeQty(-1)">−</button>
                <span id="modal-qty">1</span>
                <button onclick="changeQty(1)">+</button>
            </div>
            <button onclick="addToCart()" id="add_btn" style="padding:15px 50px; background:#ff6f91; color:white; border:none; border-radius:30px;">Добавить в корзину</button>
        </div>
    </div>

    <script>
        const products = [
            { id: "budapest", name: {ru:"Budapest / Pavlova", fi:"Budapest", en:"Budapest"}, price: 4.50, img: "budapest.jpg" },
            { id: "vanilja",  name: {ru:"Vanilja", fi:"Vanilja", en:"Vanilla"}, price: 4.50, img: "vanilja.jpg" },
            { id: "mansikka", name: {ru:"Mansikkakakku", fi:"Mansikkakermakakku", en:"Strawberry Cake"}, price: 3.80, img: "mansikkakakermakakku.jpg" },
            { id: "mohito",   name: {ru:"Mohito-lime", fi:"Mohito-lime", en:"Mohito-lime"}, price: 6.30, img: "mohitolime.jpg" },
            { id: "vohveli",  name: {ru:"Vohveli", fi:"Vohveli", en:"Waffle"}, price: 3.50, img: "vohveli.jpg" },
            { id: "napoleon", name: {ru:"Napoleon", fi:"Napoleon", en:"Napoleon"}, price: 4.50, img: "napoleon.jpg" },
            { id: "redvelvet",name: {ru:"Red Velvet", fi:"Red Velvet", en:"Red Velvet"}, price: 6.30, img: "red-velvet.jpg" },
            { id: "suklaa",   name: {ru:"Suklaakakku", fi:"Suklaakakku", en:"Chocolate Cake"}, price: 6.50, img: "sukla.jpg" }
        ];

        let currentLang = 'ru';
        let currentItem = {};
        let cart = {};

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.id === `btn-${lang}`));
            renderVitrina();
        }

        function renderVitrina() {
            const shelf = document.getElementById('shelf');
            shelf.innerHTML = '';

            products.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.id = `item${i+1}`;
                div.innerHTML = `
                    <img src="${p.img}" alt="${p.name.ru}" 
                         onerror="this.src='https://via.placeholder.com/200x200/ffe4f0/5d4037?text=Нет+фото'">
                    <p>${p.name.ru}<br><span class="price">${p.price.toFixed(2)} €</span></p>
                `;
                div.onclick = () => openModal(p);
                shelf.appendChild(div);
            });
        }

        function openModal(p) {
            currentItem = {...p, qty: 1};
            document.getElementById('modal-img').src = p.img;
            document.getElementById('modal-name').innerText = p.name.ru;
            document.getElementById('modal-price').innerText = `${p.price.toFixed(2)} € / шт`;
            document.getElementById('modal-qty').innerText = 1;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function changeQty(delta) {
            currentItem.qty = Math.max(1, currentItem.qty + delta);
            document.getElementById('modal-qty').innerText = currentItem.qty;
        }

        function addToCart() {
            cart[currentItem.id] = {...currentItem};
            updateCart();
            closeModal();
        }

        function updateCart() {
            let html = '', total = 0;
            for (let key in cart) {
                let item = cart[key];
                let sum = item.qty * item.price;
                total += sum;
                html += `<p>${item.name.ru} × ${item.qty} = ${sum.toFixed(2)} €</p>`;
            }
            document.getElementById('cart-items').innerHTML = html || '<p>Корзина пуста</p>';
            document.getElementById('total').innerText = `Итого: ${total.toFixed(2)} €`;
        }

        function sendToWhatsApp() {
            let msg = "Привет! Заказ с витрины UliBakery:\n\n";
            for (let key in cart) msg += `${cart[key].name.ru} — ${cart[key].qty} шт\n`;
            let comm = document.getElementById('comment').value.trim();
            if (comm) msg += `\nПожелания: ${comm}\n`;
            msg += "\nСпасибо ❤️";

            const phone = "358XXXXXXXXX"; // ← Замени на свой номер
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = () => setLang('ru');
    </script>
</body>
</html>
