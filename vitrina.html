<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Витрина на выходные | UliBakery</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(#fff0f5, #ffe4f0);
            color: #5d4037;
        }
        .top-bar {
            background: rgba(255,255,255,0.95);
            padding: 12px 25px;
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #fce4ec;
        }
        .lang button {
            background: #fff;
            border: 2px solid #ff6f91;
            padding: 8px 14px;
            margin-left: 8px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .lang button.active { background: #ff6f91; color: white; }

        .vitrina-container {
            max-width: 1280px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(255,111,145,0.3);
        }

        .vitrina-header {
            text-align: center;
            padding: 30px 0 20px;
            background: linear-gradient(to right, #ff6f91, #ffb2c1);
            color: white;
            margin: -20px -20px 40px;
            border-radius: 30px 30px 0 0;
        }
        .vitrina-header h1 { margin: 0; font-size: 39px; }
        .vitrina-header p { margin: 10px 0 0; font-size: 19px; }

        /* Большая витрина */
        .shelf {
            position: relative;
            height: 860px;
            background: url('https://raw.githubusercontent.com/moskovskii84-web/UliBakery/main/%D0%B2%D0%B8%D1%82%D1%80%D0%B8%D0%BD%D0%B0.png') center/cover no-repeat;
            border: 18px solid #fff;
            border-radius: 30px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.35);
            overflow: hidden;
        }

        .item {
            position: absolute;
            width: 195px;
            text-align: center;
            cursor: pointer;
            transition: all 0.45s ease;
        }
        .item:hover {
            transform: scale(1.28) rotate(7deg);
            z-index: 30;
        }
        .item img {
            width: 100%;
            height: 195px;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.45));
        }
        .item p {
            margin: 12px 0 0;
            font-weight: bold;
            font-size: 16.5px;
            line-height: 1.35;
        }

        /* Расстановка товаров — выглядит естественно */
        #item1  { top: 88px;  left: 6%; }    /* Budapest */
        #item2  { top: 155px; left: 24%; }   /* Mohito-lime */
        #item3  { top: 72px;  left: 44%; }   /* Napoleon */
        #item4  { top: 182px; left: 63%; }   /* Red Velvet */
        #item5  { top: 98px;  left: 79%; }   /* Suklaakakku */
        #item6  { top: 225px; left: 9%; }    /* Tuulihattu */
        #item7  { top: 195px; left: 31%; }   /* Hunajakakku */
        #item8  { top: 105px; left: 52%; }   /* Mansikkakermakakku */
        #item9  { top: 235px; left: 71%; }   /* Vohveli */

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.78);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 28px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 65px rgba(255,111,145,0.45);
        }
        .close { position: absolute; top: 15px; right: 25px; font-size: 40px; color: #ff6f91; cursor: pointer; }

        .qty {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 25px 0;
            font-size: 30px;
        }
        .qty button {
            width: 55px; height: 55px;
            background: #ff6f91;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 34px;
            cursor: pointer;
        }

        #cart { margin: 45px 20px 25px; padding: 25px; background: #fffafa; border-radius: 20px; border: 3px solid #fbc2eb; }
        .whatsapp-btn {
            padding: 17px 70px;
            font-size: 21px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(37,211,102,0.4);
        }

        @media (max-width: 768px) {
            .shelf { height: 640px; }
            .item { width: 155px; }
            .item img { height: 155px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang">
            <button onclick="setLang('ru')" id="btn-ru" class="active">RU</button>
            <button onclick="setLang('en')" id="btn-en">EN</button>
            <button onclick="setLang('fi')" id="btn-fi">FI</button>
        </div>
    </div>

    <div class="vitrina-container">
        <div class="vitrina-header">
            <h1 id="title">Витрина на выходные</h1>
            <p id="subtitle">Свежие десерты • Выдача: Пт 15:00–18:00 | Сб 10:00–14:00</p>
        </div>

        <div class="shelf" id="shelf"></div>

        <div id="cart">
            <h3 id="cart_title">Ваша корзина</h3>
            <div id="cart-items"></div>
            <p id="total">Итого: 0 €</p>
        </div>

        <textarea id="comment" placeholder="Ваши пожелания (без орехов, с надписью...)" style="width:100%; height:90px; padding:14px; border:2px solid #fbc2eb; border-radius:12px; font-size:16px;"></textarea>
        
        <button class="whatsapp-btn" onclick="sendToWhatsApp()" id="send_btn">📲 Отправить заказ в WhatsApp</button>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <img id="modal-img" style="width:100%; max-height:350px; object-fit:contain; border-radius:18px;">
            <h2 id="modal-name"></h2>
            <p id="modal-price" style="font-size:22px; color:#ff6f91; margin:10px 0;"></p>
            
            <div class="qty">
                <button onclick="changeQty(-1)">−</button>
                <span id="modal-qty">1</span>
                <button onclick="changeQty(1)">+</button>
            </div>
            
            <button onclick="addToCart()" id="add_btn" style="padding:15px 50px; font-size:18px; background:#ff6f91; color:white; border:none; border-radius:30px;">Добавить в корзину</button>
        </div>
    </div>

    <script>
        const translations = {
            ru: { title: "Витрина на выходные", subtitle: "Свежие десерты • Выдача: Пт 15:00–18:00 | Сб 10:00–14:00", cart_title: "Ваша корзина", total: "Итого: ", add: "Добавить в корзину", send: "📲 Отправить заказ в WhatsApp", empty: "Корзина пуста", placeholder: "Ваши пожелания..." },
            en: { title: "Weekend Showcase", subtitle: "Fresh desserts • Pickup: Fri 15-18 | Sat 10-14", cart_title: "Your cart", total: "Total: ", add: "Add to cart", send: "📲 Send to WhatsApp", empty: "Cart is empty", placeholder: "Your wishes..." },
            fi: { title: "Viikonloppu Vitriini", subtitle: "Tuoreet jälkiruoat • Nouto: pe 15-18 | la 10-14", cart_title: "Ostoskori", total: "Yhteensä: ", add: "Lisää koriin", send: "📲 Lähetä WhatsAppiin", empty: "Kori on tyhjä", placeholder: "Toiveesi..." }
        };

        const products = [

            { id: "mohito",   name: {ru:"Mohito-lime",       fi:"Mohito-lime",       en:"Mohito-lime"},       price: 6.30, img: "mohitolime.jpg" },
            { id: "napoleon", name: {ru:"Napoleon",          fi:"Napoleon",          en:"Napoleon"},          price: 4.50, img: "napoleon.jpg" },
            { id: "redvelvet",name: {ru:"Red Velvet",        fi:"Red Velvet",        en:"Red Velvet"},        price: 6.30, img: "red-velvet.jpg" },
            { id: "suklaa",   name: {ru:"Suklaakakku",       fi:"Suklaakakku",       en:"Chocolate Cake"},    price: 6.50, img: "sukla.jpg" },
            { id: "tuuli",    name: {ru:"Tuulihattu",        fi:"Tuulihattu",        en:"Tuulihattu"},        price: 3.20, img: "IMG_7897.jpg" },
            { id: "hunaja",   name: {ru:"Hunajakakku",       fi:"Hunajakakku",       en:"Honey Cake"},        price: 3.90, img: "IMG_7897.jpg" },
            { id: "mansikka", name: {ru:"Mansikkakakku",     fi:"Mansikkakermakakku",en:"Strawberry Cake"},   price: 3.80, img: "mansikkakakermakakku.jpg" },
            { id: "vohveli",  name: {ru:"Vohveli",           fi:"Vohveli",           en:"Waffle"},            price: 3.50, img: "vohveli.jpg" }
        ];

        let currentLang = 'ru';
        let currentItem = {};
        let cart = {};

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.id === `btn-${lang}`));
            
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('subtitle').innerText = translations[lang].subtitle;
            document.getElementById('cart_title').innerText = translations[lang].cart_title;
            document.getElementById('add_btn').innerText = translations[lang].add;
            document.getElementById('send_btn').innerText = translations[lang].send;
            document.getElementById('comment').placeholder = translations[lang].placeholder;

            renderVitrina();
            updateCart();
        }

        function renderVitrina() {
            const shelf = document.getElementById('shelf');
            shelf.innerHTML = '';

            products.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div
