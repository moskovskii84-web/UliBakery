<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="v_title">Витрина на выходные | UliBakery</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            color: #5d4037; 
            background-color: #fff6f8; 
            background-image: radial-gradient(#fbc2eb 15%, transparent 15%); 
            background-size: 35px 35px; 
            background-attachment: fixed; 
            line-height: 1.5;
        }
        .top-bar { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #fce4ec; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .back-link { 
            text-decoration: none; 
            font-weight: bold; 
            color: #ff6f91; 
            font-size: 15px; 
        }
        .lang button { 
            background: #fff; 
            border: 1px solid #ffb2c1; 
            padding: 6px 11px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            margin-left: 5px; 
        }
        .lang button.active { 
            background: #ff6f91; 
            color: white; 
            border-color: #ff6f91; 
        }
        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 15px; 
        }
        h1 { 
            text-align: center; 
            color: #ff6f91; 
            font-family: 'Georgia', serif; 
            font-size: 28px; 
            margin: 20px 0 35px; 
        }
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); 
            gap: 18px; 
        }
        .product-card { 
            background: white; 
            border-radius: 20px; 
            padding: 12px; 
            text-align: center; 
            box-shadow: 0 8px 15px rgba(251, 194, 235, 0.3); 
            border: 1px solid #fce4ec; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .product-card:hover { transform: translateY(-6px); }
        .product-card img { 
            width: 100%; 
            height: 145px; 
            object-fit: cover; 
            border-radius: 15px; 
        }
        .price { 
            color: #ff6f91; 
            font-weight: bold; 
            font-size: 16.5px; 
            margin-top: 8px; 
        }
        .cart-section { 
            margin-top: 50px; 
            background: white; 
            padding: 25px; 
            border-radius: 25px; 
            border: 2px solid #fbc2eb; 
        }
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px dashed #fce4ec; 
        }
        .qty-controls { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .qty-btn { 
            background: #ff6f91; 
            color: white; 
            border: none; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 18px; 
        }
        .input-field { 
            width: 100%; 
            padding: 14px; 
            margin: 15px 0; 
            border: 2px solid #fce4ec; 
            border-radius: 12px; 
            font-size: 16px; 
        }
        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: #25D366; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px; 
        }
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.65); 
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            background: white; 
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-link" id="back_btn">← На главную</a>
    <div class="lang">
        <button onclick="setLang('fi')" id="btn-fi">FI</button>
        <button onclick="setLang('ru')" id="btn-ru">RU</button>
        <button onclick="setLang('en')" id="btn-en">EN</button>
    </div>
</div>

<div class="container">
    <h1 id="v_title">Витрина на выходные</h1>
    
    <div class="products-grid" id="products_grid"></div>

    <div class="cart-section">
        <h2 id="c_title">Ваша корзина</h2>
        <div id="cart_items"></div>
        
        <div style="margin-top: 25px; font-size: 21px; font-weight: bold; text-align: right;">
            <span id="c_total_label">Итого</span>: <span id="total_price">0.00</span> €
        </div>

        <form action="https://formspree.io/f/mjgapyny" method="POST" id="orderForm">
            <input type="hidden" name="_next" value="thankyou.html">
            <input type="hidden" name="_subject" value="Новый заказ с витрины на выходные!">
            
            <input type="email" name="Email_клиента" class="input-field" placeholder="Ваш Email" required id="f_email">
            <input type="hidden" name="Детали_заказа" id="hiddenOrder">
            <input type="hidden" name="Сумма_заказа" id="hiddenTotal">

            <button type="submit" class="submit-btn" id="btn_send">ОТПРАВИТЬ ЗАКАЗ</button>
        </form>
    </div>
</div>

<!-- Модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="m_name" style="color:#ff6f91; margin-bottom:20px;"></h3>
        <div style="margin: 25px 0; display: flex; justify-content: center; align-items: center; gap: 25px; font-size: 24px;">
            <button type="button" onclick="changeQty(-1)" class="qty-btn">-</button>
            <b id="m_qty">1</b>
            <button type="button" onclick="changeQty(1)" class="qty-btn">+</button>
        </div>
        <button type="button" onclick="addToCart()" class="submit-btn" style="background:#ff6f91;">Добавить в корзину</button>
        <p onclick="closeModal()" style="cursor:pointer; color:gray; margin-top:20px;">Отмена</p>
    </div>
</div>

<script>
    const products = [
        { id: "p1", name: {ru:"Будапешт", fi:"Budapest", en:"Budapest"}, price: 4.50, img: "budapest.jpg" },
        { id: "p2", name: {ru:"Ваниль", fi:"Vanilja", en:"Vanilla"}, price: 4.50, img: "vanilja.jpg" },
        { id: "p3", name: {ru:"Клубничный торт", fi:"Mansikkakakku", en:"Strawberry"}, price: 3.80, img: "mansikkakermakakku.jpg" },
        { id: "p4", name: {ru:"Мохито-лайм", fi:"Mohito-lime", en:"Mohito-lime"}, price: 6.30, img: "mohitolime.jpg" },
        { id: "p5", name: {ru:"Вафля", fi:"Vohveli", en:"Waffle"}, price: 3.50, img: "vohveli.jpg" },
        { id: "p6", name: {ru:"Наполеон", fi:"Napoleon", en:"Napoleon"}, price: 4.50, img: "napoleon.jpg" },
        { id: "p7", name: {ru:"Красный бархат", fi:"Red Velvet", en:"Red Velvet"}, price: 6.30, img: "red-velvet.jpg" },
        { id: "p8", name: {ru:"Шоколадный торт", fi:"Suklaakakku", en:"Chocolate"}, price: 6.50, img: "sukla.jpg" },
        { id: "p9", name: {ru:"Орешки со сгущенкой", fi:"Pähkinät kinuskilla", en:"Nuts with milk"}, price: 1.50, img: "keksi.jpg" },
        { id: "p10", name: {ru:"Кейк-попс", fi:"Kakkutikkari", en:"Cake Pop"}, price: 2.50, img: "cake-pops.jpg" }
    ];

    let cart = {};
    let tempItem = null;
    let currentLang = localStorage.getItem('uliLang') || 'ru';

    const ui = {
        ru: { title: "Витрина на выходные", cart: "Ваша корзина", total: "Итого", send: "ОТПРАВИТЬ ЗАКАЗ", back: "← На главную", email: "Ваш Email" },
        fi: { title: "Viikonlopun vitriini", cart: "Ostoskori", total: "Yhteensä", send: "LÄHETÄ TILAUS", back: "← Etusivulle", email: "Sähköpostisi" },
        en: { title: "Weekend Showcase", cart: "Your Cart", total: "Total", send: "SEND ORDER", back: "← Back Home", email: "Your Email" }
    };

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('uliLang', lang);

        document.getElementById('v_title').innerText = ui[lang].title;
        document.getElementById('c_title').innerText = ui[lang].cart;
        document.getElementById('c_total_label').innerText = ui[lang].total;
        document.getElementById('btn_send').innerText = ui[lang].send;
        document.getElementById('back_btn').innerText = ui[lang].back;
        document.getElementById('f_email').placeholder = ui[lang].email;

        document.querySelectorAll('.lang button').forEach(btn => {
            btn.classList.toggle('active', btn.id === `btn-${lang}`);
        });

        renderProducts();
        updateCartUI();
    }

    function renderProducts() {
        const grid = document.getElementById('products_grid');
        grid.innerHTML = '';
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openModal(p);
            card.innerHTML = `
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200?text=${encodeURIComponent(p.name.ru)}'">
                <h3>${p.name[currentLang]}</h3>
                <span class="price">${p.price.toFixed(2)} €</span>
            `;
            grid.appendChild(card);
        });
    }

    function openModal(p) {
        tempItem = { ...p, qty: 1 };
        document.getElementById('m_name').innerText = p.name[currentLang];
        document.getElementById('m_qty').innerText = 1;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function changeQty(d) {
        tempItem.qty = Math.max(1, tempItem.qty + d);
        document.getElementById('m_qty').innerText = tempItem.qty;
    }

    function addToCart() {
        if (cart[tempItem.id]) {
            cart[tempItem.id].qty += tempItem.qty;
        } else {
            cart[tempItem.id] = { ...tempItem };
        }
        closeModal();
        updateCartUI();
    }

    function updateQtyInCart(id, d) {
        if (cart[id]) {
            cart[id].qty += d;
            if (cart[id].qty <= 0) delete cart[id];
            updateCartUI();
        }
    }

    function updateCartUI() {
        const container = document.getElementById('cart_items');
        container.innerHTML = '';
        let total = 0;
        let summary = "";

        for (let id in cart) {
            const item = cart[id];
            const sum = item.price * item.qty;
            total += sum;
            summary += `${item.name[currentLang]} × ${item.qty} шт (${sum.toFixed(2)} €)\n`;

            container.innerHTML += `
                <div class="cart-item">
                    <span><b>${item.name[currentLang]}</b></span>
                    <div class="qty-controls">
                        <button type="button" class="qty-btn" onclick="updateQtyInCart('${id}', -1)">−</button>
                        <b>${item.qty}</b>
                        <button type="button" class="qty-btn" onclick="updateQtyInCart('${id}', 1)">+</button>
                    </div>
                    <span>${sum.toFixed(2)} €</span>
                </div>`;
        }

        document.getElementById('total_price').innerText = total.toFixed(2);
        document.getElementById('hiddenOrder').value = summary || "Корзина пуста";
        document.getElementById('hiddenTotal').value = total.toFixed(2) + " €";
    }

    // Проверка перед отправкой
    document.getElementById('orderForm').onsubmit = function() {
        if (Object.keys(cart).length === 0) {
            alert(currentLang === 'ru' ? "Корзина пуста! Добавьте товары." : currentLang === 'fi' ? "Ostoskori on tyhjä!" : "Cart is empty!");
            return false;
        }
        return true;
    };

    // Инициализация при загрузке
    window.onload = () => {
        setLang(currentLang);
    };
</script>
</body>
</html>
