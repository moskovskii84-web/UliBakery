<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Витрина на выходные | UliBakery</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: #fff6f8;
            background-image: radial-gradient(#fbc2eb 15%, transparent 15%); 
            background-size: 35px 35px; 
            background-attachment: fixed;
            color: #5d4037;
        }
        .top-bar { 
            background: rgba(255,255,255,0.98); 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #fce4ec; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .back-link { text-decoration: none; font-weight: bold; color: #ff6f91; }
        .lang button { 
            background: #fff; 
            border: 1px solid #ffb2c1; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-left: 5px; 
        }
        .lang button.active { background: #ff6f91; color: white; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        h1 { 
            text-align: center; 
            color: #ff6f91; 
            font-family: 'Georgia', serif; 
            font-size: 29px; 
            margin: 25px 0 40px; 
        }
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 20px; 
        }
        .product-card { 
            background: white; 
            border-radius: 20px; 
            padding: 12px; 
            text-align: center; 
            box-shadow: 0 8px 18px rgba(251,194,235,0.25); 
            border: 1px solid #fce4ec; 
            cursor: pointer; 
            transition: transform 0.3s; 
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 15px; }
        .price { color: #ff6f91; font-weight: bold; margin-top: 8px; }

        .cart-section { 
            margin-top: 50px; 
            background: white; 
            padding: 25px; 
            border-radius: 25px; 
            border: 2px solid #fbc2eb; 
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-link" id="back_btn">← На главную</a>
    <div class="lang">
        <button onclick="setLang('fi')" id="btn-fi">FI</button>
        <button onclick="setLang('ru')" id="btn-ru">RU</button>
        <button onclick="setLang('en')" id="btn-en">EN</button>
    </div>
</div>

<div class="container">
    <h1 id="v_title">Витрина на выходные</h1>
    <div class="products-grid" id="products_grid"></div>

    <!-- Корзина и форма остаются как были, но можно добавить позже -->

</div>

<script>
    const products = [
        { id: "p1", name: {ru:"Будапешт", fi:"Budapest", en:"Budapest"}, price: 4.50, img: "budapest.jpg" },
        { id: "p2", name: {ru:"Ваниль", fi:"Vanilja", en:"Vanilla"}, price: 4.50, img: "vanilja.jpg" },
        { id: "p3", name: {ru:"Клубничный торт", fi:"Mansikkakakku", en:"Strawberry"}, price: 3.80, img: "mansikkakermakakku.jpg" },
        { id: "p4", name: {ru:"Мохито-лайм", fi:"Mohito-lime", en:"Mohito-lime"}, price: 6.30, img: "mohitolime.jpg" },
        { id: "p5", name: {ru:"Вафля", fi:"Vohveli", en:"Waffle"}, price: 3.50, img: "vohveli.jpg" },
        { id: "p6", name: {ru:"Наполеон", fi:"Napoleon", en:"Napoleon"}, price: 4.50, img: "napoleon.jpg" },
        { id: "p7", name: {ru:"Красный бархат", fi:"Red Velvet", en:"Red Velvet"}, price: 6.30, img: "red-velvet.jpg" },
        { id: "p8", name: {ru:"Шоколадный торт", fi:"Suklaakakku", en:"Chocolate"}, price: 6.50, img: "sukla.jpg" },
        { id: "p9", name: {ru:"Орешки со сгущенкой", fi:"Pähkinät kinuskilla", en:"Nuts with milk"}, price: 1.50, img: "keksi.jpg" },
        { id: "p10", name: {ru:"Кейк-попс", fi:"Kakkutikkari", en:"Cake Pop"}, price: 2.50, img: "cake-pops.jpg" }
    ];

    let currentLang = localStorage.getItem('uliLang') || 'ru';

    const translations = {
        ru: {
            page_title: "Витрина на выходные | UliBakery",
            v_title: "Витрина на выходные",
            back_btn: "← На главную"
        },
        fi: {
            page_title: "Viikonlopun vitriini | UliBakery",
            v_title: "Viikonlopun vitriini",
            back_btn: "← Etusivulle"
        },
        en: {
            page_title: "Weekend Showcase | UliBakery",
            v_title: "Weekend Showcase",
            back_btn: "← Back Home"
        }
    };

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('uliLang', lang);

        const t = translations[lang];

        document.title = t.page_title;
        document.getElementById('v_title').innerText = t.v_title;
        document.getElementById('back_btn').innerText = t.back_btn;

        // Подсвечиваем активную кнопку
        document.querySelectorAll('.lang button').forEach(btn => {
            btn.classList.toggle('active', btn.id === `btn-${lang}`);
        });

        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('products_grid');
        grid.innerHTML = '';
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200?text=${p.name.ru}'">
                <h3>${p.name[currentLang]}</h3>
                <span class="price">${p.price.toFixed(2)} €</span>
            `;
            grid.appendChild(card);
        });
    }

    // Запуск при загрузке
    window.onload = () => {
        setLang(currentLang);
    };
</script>
</body>
</html>
